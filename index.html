fter {7:30} the route is noticeably quieter and the lights are just as good. Members get one discounted night per season."]},"summer-hours":{"t":"Summer Hours - Indiana Zooniversity","l":"Summer Hours","v":4,"p":"daily-seasonal-hours","c":["extended-evening-hours"],"h":"Long days, late light","d":"From Memorial Day through Labor Day the zoo stays open into the evening, and the animals are noticeably more active after 5 p.m.","s":"What summer hours actually change","b":["Gates open at 9 a.m. and close at 7 p.m., with last admission at 6 p.m. Outdoor habitats stay open the full day; indoor galleries close 30 minutes early for cleaning."]},"concert-lineup":{"t":"Concert Lineup - Indiana Zooniversity","l":"Concert Lineup","v":4,"p":"summer-zoo-nights-concert-series","c":["july-lineup"],"h":"Who's playing this summer","d":"Thirteen Friday nights across three months, spanning local bands, regional touring acts, and two headline nights.","s":"How the lineup is organized","b":["June leans local and acoustic, July brings the two headline nights, and August closes with the family-oriented shows. Full lineups post {60} days ahead of each month."]},"group-tickets":{"t":"Group Tickets - Indiana Zooniversity","l":"Group Tickets","v":4,"p":"tickets-pricing","c":["group-booking-rates"],"h":"Rates for 15 or more","d":"Groups of 15 or more get discounted admission, a reserved arrival window, and a dedicated entry lane away from the main gate.","s":"Who qualifies as a group","b":["Any party of 15 or more paid admissions booked under a single reservation, including schools, camps, workplaces, and community organizations."]},"hoofed-herds":{"t":"Hoofed Herds - Indiana Zooniversity","l":"Hoofed Herds","v":4,"p":"grasslands-plains","c":["plains-zebra","reticulated-giraffe"],"h":"Built to run","d":"Zebra, giraffe, and antelope share the northern half of the savanna in a mixed-species herd that shifts and reforms throughout the day.","s":"Why we mix species","b":["In the wild these animals herd together for shared vigilance — more eyes watching for predators. Housing them together produces the same alert, social behavior you'd see on a real plain."]},"grades-612":{"t":"Grades 6–12 - Indiana Zooniversity","l":"Grades 6–12","v":4,"p":"guided-programs-by-grade","h":"Conservation science and real data","d":"Older students work with actual population data from our field projects, model a conservation decision, and defend it to the group.","s":"Working with the real numbers","b":["Students receive the same population data our field partners use, weigh trade-offs between habitat protection and community needs, and present a recommendation."]},"volunteer-roles":{"t":"Volunteer Roles - Indiana Zooniversity","l":"Volunteer Roles","v":4,"p":"adult-volunteer-program","c":["docent-program"],"h":"Where you'd fit","d":"Five role tracks with different training paths, physical demands, and visitor contact levels. Most volunteers try one and move between tracks over time.","s":"The five tracks","b":["Docent interpretation, horticulture crew, education support, guest services, and animal care assistance. Animal care has the longest waitlist and the most prerequisites."]},"animal-adaptations-unit":{"t":"Animal Adaptations Unit - Indiana Zooniversity","l":"Animal Adaptations Unit","v":4,"p":"lesson-plans","c":["printable-worksheets"],"h":"Form follows habitat","d":"A four-lesson unit for grades 3–5 on how physical and behavioral adaptations let animals survive in specific environments.","s":"What students do","b":["Students compare beak shapes to food sources, design an animal for an assigned habitat, and defend their design choices against a peer review."]},"meerkat-mob":{"t":"Meerkat Mob - Indiana Zooniversity","l":"Meerkat Mob","v":4,"p":"deserts-dry-lands","h":"Always someone on watch","d":"Our mob of twelve runs a genuine sentry rotation — one animal standing guard while the rest forage. Watch long enough and you'll see the shift change.","s":"How the sentry system works","b":["Sentries take turns on elevated posts, giving different alarm calls for aerial and ground threats. The rest of the mob responds differently to each — flatten for a hawk, bolt for a burrow otherwise."]},"big-mammals":{"t":"Big Mammals - Indiana Zooniversity","l":"Big Mammals","v":4,"p":"grasslands-plains","c":["african-lion","african-elephant","white-rhino"],"h":"Heavyweights of the plains","d":"Get up close with Africa's most iconic megafauna. From apex predators to massive grazers, meet the giant species that shape the grassland ecosystem.","s":"Why the big ones matter most","b":["Megafauna are ecosystem engineers. Elephants open woodland into grassland, rhinos crop turf that smaller grazers depend on, and lions shape where every herd chooses to feed."]},"wedding-packages-pricing":{"t":"Wedding Packages & Pricing - Indiana Zooniversity","l":"Wedding Packages & Pricing","v":4,"p":"weddings","h":"What a zoo wedding costs","d":"Three packages covering ceremony only, ceremony and reception, and a full-day buyout of the entire zoo. All include a coordinator and after-hours access.","s":"Package tiers","b":["Ceremony only from {$3,500}, ceremony and reception from {$9,000}, and full zoo buyout from {$45,000}. A portion of every wedding fee funds animal care."]},"two-hour-highlights-route":{"t":"Two-Hour Highlights Route - Indiana Zooniversity","l":"Two-Hour Highlights Route","v":4,"p":"suggested-routes","h":"The short loop","d":"Two hours covering the six most-requested habitats with minimal backtracking. Best for a first visit with young children.","s":"What the route covers","b":["Africa savanna, big mammals, penguin coast, the aquarium galleries, lorikeet landing, and the discovery playground. Roughly one mile of level paved path."]},"ceremony-venues":{"t":"Ceremony Venues - Indiana Zooniversity","l":"Ceremony Venues","v":4,"p":"weddings","c":["savanna-overlook","tropical-aviary-hall"],"h":"Where to hold the ceremony","d":"Two dedicated ceremony spaces with very different characters — one open-air overlooking the savanna, one enclosed among free-flying tropical birds.","s":"Choosing between them","b":["The overlook is outdoor, seats up to {200}, and depends on weather. The aviary hall is fully enclosed, seats {120}, and works year-round regardless of conditions."]},"food-drink-at-zoo-nights":{"t":"Food & Drink at Zoo Nights - Indiana Zooniversity","l":"Food & Drink at Zoo Nights","v":4,"p":"summer-zoo-nights-concert-series","h":"Eating at the concerts","d":"Four food trucks rotate weekly on the plaza alongside the regular restaurants, plus a beer and wine garden for guests {21} and over.","s":"What's available","b":["Rotating food trucks, both plaza restaurants open until {8:30}, and a fenced beer and wine garden with ID check at the entrance. Outside food is permitted; outside alcohol is not."]},"carnivore-care-tour":{"t":"Carnivore Care Tour - Indiana Zooniversity","l":"Carnivore Care Tour","v":4,"p":"behind-the-scenes-tours","c":["book-a-carnivore-tour"],"h":"Behind the lion habitat","d":"A {60}-minute tour of the carnivore holding building, training wall, and diet prep area with a member of the carnivore care team.","s":"What you'll see","b":["The holding barn and its training wall, the protected-contact system keepers use, and a live target training demonstration with one of the lions from the safe side of the mesh."]},"giant-river-otter":{"t":"Giant River Otter - Indiana Zooniversity","l":"Giant River Otter","v":4,"p":"amazon-flooded-forest","c":["otter-training-session"],"h":"The Amazon's loudest neighbor","d":"Giant river otters reach six feet nose to tail and communicate with a vocabulary of at least {22} distinct calls. You'll hear our family group before you reach the habitat.","s":"A family that hunts together","b":["Giant otters live in tight family groups that fish cooperatively, herding shoals into shallow water. Ours are fed live-swimming fish several times a week to keep the behavior intact."]},"wheelchair-stroller-rentals":{"t":"Wheelchair & Stroller Rentals - Indiana Zooniversity","l":"Wheelchair & Stroller Rentals","v":4,"p":"mobility-wheelchair-access","c":["rental-locations-rates"],"h":"Rent on arrival","d":"Manual wheelchairs, electric scooters, and single and double strollers are available first-come, first-served, with a limited number held for advance reservations.","s":"What's in the fleet","b":["{40} manual wheelchairs, {15} electric scooters, and {120} strollers. Wheelchairs are free; scooters and strollers carry a daily rate."]},"discount-free-days":{"t":"Discount & Free Days - Indiana Zooniversity","l":"Discount & Free Days","v":4,"p":"tickets-pricing","h":"Reduced and free admission","d":"We hold free community days each season and offer standing discounts for military families, EBT cardholders, and college students.","s":"Standing discounts","b":["Active-duty and veteran military receive {50%} off, EBT and WIC cardholders pay {$3} per person, and college students with ID save {$5} on weekdays."]},"accessible-parking":{"t":"Accessible Parking - Indiana Zooniversity","l":"Accessible Parking","v":4,"p":"parking","h":"Accessible spaces and drop-off","d":"{60} accessible spaces sit in the east lot directly beside a step-free entrance. A passenger drop-off loop is available at the main gate.","s":"Getting from car to gate","b":["The east accessible row connects to the gate by a level paved path with no curb cuts or ramps. Wheelchairs can be reserved ahead and collected inside the entrance."]},"keeper-talk-locations":{"t":"Keeper Talk Locations - Indiana Zooniversity","l":"Keeper Talk Locations","v":4,"p":"keeper-talks","c":["kopje-overlook-talks"],"h":"Where the talks happen","d":"Eleven habitats host regular keeper talks. Each has a marked gathering spot with seating or standing room and a posted time.","s":"Finding the gathering spot","b":["Look for the red circular marker on the pathway. Each marker lists that habitat's talk times and shows how far it is to the next nearest talk location."]},"winter-hours":{"t":"Winter Hours - Indiana Zooniversity","l":"Winter Hours","v":4,"p":"daily-seasonal-hours","h":"Quieter days, closer views","d":"Winter brings the shortest hours and the smallest crowds. Cold-weather species like the tigers, red pandas, and polar bears are at their most active.","s":"What to expect from December through February","b":["Gates open at 10 a.m. and close at 4 p.m. Some tropical habitats operate on a reduced indoor schedule, and outdoor dining is closed."]},"bus-oversized-vehicles":{"t":"Bus & Oversized Vehicles - Indiana Zooniversity","l":"Bus & Oversized Vehicles","v":4,"p":"parking","c":["bus-drop-off-procedure"],"h":"Buses, RVs, and trailers","d":"Oversized vehicles park in the east lot, which has pull-through lanes and no height restriction. School buses have a dedicated row.","s":"What counts as oversized","b":["Anything over 20 feet or 8 feet tall — school buses, motor coaches, RVs, and vehicles with trailers. Standard vans and minivans use the regular lots."]},"grades-15":{"t":"Grades 1–5 - Indiana Zooniversity","l":"Grades 1–5","v":4,"p":"guided-programs-by-grade","h":"Adaptations in action","d":"Students investigate how body structures match habitats, then head into the zoo to find examples in living animals with a field observation sheet.","s":"Classroom to habitat","b":["The session opens with a live animal comparison, then students collect observations at three assigned habitats and report back on what they found."]},"booking-reservations":{"t":"Booking & Reservations - Indiana Zooniversity","l":"Booking & Reservations","v":4,"p":"plan-a-field-trip","c":["request-a-date"],"h":"How reservations work","d":"All field trips are reserved through the online request system. A reservation isn't confirmed until you receive a written confirmation number.","s":"What you'll need to hand","b":["Preferred and backup dates, estimated headcount, grade level, program choice, and a school billing contact. Headcounts can change up to {14} days out."]},"chaperone-guidelines":{"t":"Chaperone Guidelines - Indiana Zooniversity","l":"Chaperone Guidelines","v":4,"p":"plan-a-field-trip","h":"What chaperones need to know","d":"One chaperone per ten students is required and admitted free. Additional adults pay the group rate. Share this page with every chaperone before the visit.","s":"The chaperone's job","b":["Keep your group together, know your meeting point and time, and enforce the zoo's habitat rules. Chaperones stay with students at all times, including in restrooms and the gift shop."]},"adoptable-species":{"t":"Adoptable Species - Indiana Zooniversity","l":"Adoptable Species","v":4,"p":"adopt-an-animal","h":"Who you can sponsor","d":"Thirty-two species are currently available for adoption, from the lion pride to the tide pool sea stars. Each listing shows what that animal's annual care costs.","s":"Choosing an animal","b":["Listings show each species' annual care cost and current adoption count. Some animals — the pandas, the polar bears — carry higher minimums because their care costs more."]},"reciprocal-zoo-admission":{"t":"Reciprocal Zoo Admission - Indiana Zooniversity","l":"Reciprocal Zoo Admission","v":4,"p":"member-benefits","h":"Your card works elsewhere","d":"Membership includes free or discounted admission at more than {150} zoos and aquariums across North America through the reciprocal network.","s":"How reciprocity works","b":["Present your card and a photo ID at the partner's gate. Most partners offer {50%} off; roughly {60} admit reciprocal members free. Partners within {90} miles of us are excluded."]},"primates":{"t":"Primates - Indiana Zooniversity","l":"Primates","v":4,"p":"rainforests-woods","c":["western-lowland-gorilla","chimpanzee"],"h":"Our closest relatives","d":"Two great ape groups share the forest habitat's western half, with indoor and outdoor access they control themselves throughout the day.","s":"Letting the animals choose","b":["Doors between indoor and outdoor spaces stay open year-round, so the apes decide where to spend their day. On cold mornings expect to find them inside behind glass."]},"camp-sessions-ages":{"t":"Camp Sessions & Ages - Indiana Zooniversity","l":"Camp Sessions & Ages","v":4,"p":"summer-camp","c":["junior-explorers-ages-57","wildlife-investigators-ages-810","conservation-crew-ages-1113"],"h":"Three age bands, nine weeks","d":"Camps are grouped into three age bands with different access levels, activity types, and daily structures. Campers must fall within the band's age range on the first day.","s":"Choosing a session","b":["Register for the band matching your child's age, not their grade. Bands are capped at {16} campers with two educators and rotating keeper visits."]},"polar-bear":{"t":"Polar Bear - Indiana Zooniversity","l":"Polar Bear","v":4,"p":"polar-shores","c":["underwater-dive-window"],"h":"The Arctic's apex predator","d":"Our two bears are both rescues, unreleasable after being orphaned as cubs. They swim most actively in the two hours after their morning feed.","s":"Black skin under white fur","b":["Polar bear fur is transparent and hollow, not white — it scatters light. Underneath, the skin is black to absorb heat. Sea ice loss makes them one of the clearest indicators of a warming Arctic."]},"pre-k-kindergarten":{"t":"Pre-K & Kindergarten - Indiana Zooniversity","l":"Pre-K & Kindergarten","v":4,"p":"guided-programs-by-grade","h":"First zoo, first questions","d":"A {45}-minute sensory program built for the youngest visitors — animal sounds, textures, movement, and a lot of pointing.","s":"What the session covers","b":["Students meet two ambassador animals, handle biofacts like feathers and shed snake skin, and practice the three zoo rules through movement and song."]},"keeper-for-a-day-package":{"t":"Keeper for a Day Package - Indiana Zooniversity","l":"Keeper for a Day Package","v":4,"p":"party-packages","c":["add-on-animal-encounters"],"h":"The birthday child works a shift","d":"For ages 8 and up, the birthday child spends {30} minutes back-of-house with a keeper — preparing a diet, placing enrichment, and getting a photo in the keeper vest.","s":"What the birthday child does","b":["Prepares one animal's actual diet, places an enrichment item into a habitat, and returns with photos. One parent or guardian accompanies them; other guests stay with the party host."]},"humboldt-penguin":{"t":"Humboldt Penguin - Indiana Zooniversity","l":"Humboldt Penguin","v":4,"p":"penguin-coast","h":"Desert-coast penguins","d":"Humboldts nest in burrows along the arid Peruvian and Chilean coast, where air temperatures reach the {80}s. Our colony of {22} breeds on site most years.","s":"Burrow nesters","b":["Rather than building nests, Humboldts dig into guano deposits and rock crevices. Our habitat includes {18} artificial burrows, and pairs return to the same one year after year."]},"diet-preparation":{"t":"Diet Preparation - Indiana Zooniversity","l":"Diet Preparation","v":4,"p":"nutrition-commissary","c":["behind-the-scenes-commissary-tour"],"h":"Weighed, tracked, and logged","d":"Every diet is portioned by weight and recorded against the animal that receives it, so intake changes are caught within a day.","s":"Why weight matters so much","b":["A drop in food intake is often the first sign an animal is unwell, sometimes days before any other symptom. Weighing every diet turns feeding into a daily health screen."]},"aquarium-backstage-tour":{"t":"Aquarium Backstage Tour - Indiana Zooniversity","l":"Aquarium Backstage Tour","v":4,"p":"behind-the-scenes-tours","h":"Above the tanks","d":"A {45}-minute tour of the aquarium's life-support systems, quarantine room, and the open top of the main reef tank.","s":"What you'll see","b":["The filtration and water chemistry room that keeps {240,000} gallons alive, the quarantine system every new fish passes through, and a feed from the catwalk above the reef tank."]},"full-day-explorer-route":{"t":"Full-Day Explorer Route - Indiana Zooniversity","l":"Full-Day Explorer Route","v":4,"p":"suggested-routes","h":"The long loop","d":"Five to six hours covering every region, both indoor galleries, and three scheduled demonstrations. Built around a midday lunch break at the plaza.","s":"Pacing the day","b":["Start with Africa at opening while animals are active, break for lunch at noon, then move indoors for the hottest part of the afternoon before finishing at Arctic & Oceans."]},"adoption-packages":{"t":"Adoption Packages - Indiana Zooniversity","l":"Adoption Packages","v":4,"p":"adopt-an-animal","c":["symbolic-adoption-kit","premium-adoption-kit"],"h":"Two package levels","d":"A standard kit that arrives by mail and a premium kit that adds an in-person visit with the animal's keeper.","s":"Choosing a package","b":["The symbolic kit at {$60} works well as a gift and ships anywhere. The premium kit at {$250} includes a scheduled keeper meeting and only makes sense for local recipients."]},"general-admission":{"t":"General Admission - Indiana Zooniversity","l":"General Admission","v":4,"p":"tickets-pricing","h":"Standard daily tickets","d":"General admission is timed entry — pick an arrival window when you buy, then stay as long as you like.","s":"Pricing and age brackets","b":["Adults {$24}, youth ages 3–12 {$18}, seniors 65+ {$20}, children 2 and under free. Online tickets save {$3} per person over gate pricing."]},"member-only-events":{"t":"Member-Only Events - Indiana Zooniversity","l":"Member-Only Events","v":4,"p":"member-benefits","h":"Nights the zoo is yours","d":"Four members-only evenings a year with reduced crowds, extra keeper talks, and first look at new habitats before they open publicly.","s":"What happens at a member night","b":["The zoo stays open three hours past closing for members only. Attendance runs about a tenth of a normal day, which means every habitat is genuinely viewable."]},"individual-dual":{"t":"Individual & Dual - Indiana Zooniversity","l":"Individual & Dual","v":4,"p":"membership-levels","h":"For one or two people","d":"Individual covers one named adult; Dual covers two named adults in the same household. Both include early entry and the full discount set.","s":"What's covered","b":["Individual {$79}, Dual {$119} per year. Named adults only — no children or guests included. Both levels carry reciprocal admission at participating zoos."]},"event-sponsorships":{"t":"Event Sponsorships - Indiana Zooniversity","l":"Event Sponsorships","v":4,"p":"sponsorship-opportunities","c":["zoo-nights-sponsorship"],"h":"Sponsor a signature event","d":"Four signature events a year, each drawing between {18,000} and {95,000} attendees, with tiered sponsorship packages for each.","s":"What sponsorship includes","b":["Logo placement across event materials, an on-site activation space, complimentary tickets for employees, and recognition from the stage at ticketed events."]},"keepers-circle":{"t":"Keeper's Circle - Indiana Zooniversity","l":"Keeper's Circle","v":4,"p":"membership-levels","h":"For the deeply involved","d":"Our supporting level, adding behind-the-scenes access, two annual keeper-hosted events, and recognition in the annual report.","s":"What's included","b":["Everything in Family Plus, one complimentary behind-the-scenes tour each year, two members-only keeper events, and {$300} of the {$500} annual fee is tax-deductible."]},"local-regional-projects":{"t":"Local & Regional Projects - Indiana Zooniversity","l":"Local & Regional Projects","v":4,"p":"field-conservation-projects","h":"Conservation close to home","d":"Four projects within {200} miles — freshwater mussel restoration, box turtle monitoring, native pollinator habitat, and a bat white-nose syndrome study.","s":"Why local work matters","b":["Endangered species aren't only in distant places. The freshwater mussels in the creek two miles from here are among the most threatened animals in North America."]},"camp-registration":{"t":"Camp Registration - Indiana Zooniversity","l":"Camp Registration","v":4,"p":"summer-camp","h":"How to register","d":"Registration opens {February 1} at {9:00 AM} for members and {February 8} for the general public. Popular sessions fill within the first hour.","s":"What you'll need ready","b":["Camper's birth date, emergency contacts, medical and allergy information, authorized pickup names, and payment. Financial assistance applications close {April 1}."]},"apply-to-volunteer":{"t":"Apply to Volunteer - Indiana Zooniversity","l":"Apply to Volunteer","v":4,"p":"teen-volunteer-corps","c":["interview-training-dates"],"h":"Application steps","d":"Applications open twice a year and close hard on the posted date. The process runs application, interview, training, and placement.","s":"What the application asks for","b":["A short written statement, one adult reference who isn't a family member, availability for the season, and parent or guardian consent for applicants under {18}."]},"habitat-naming":{"t":"Habitat Naming - Indiana Zooniversity","l":"Habitat Naming","v":4,"p":"sponsorship-opportunities","h":"Put your name on a habitat","d":"Multi-year naming rights on habitats, buildings, and pathways, with permanent on-site signage and recognition in every map and guide.","s":"How naming works","b":["Naming commitments run five to twenty years depending on the space and the gift level. Signage design is developed jointly and must fit the zoo's wayfinding system."]},"amur-tiger":{"t":"Amur Tiger - Indiana Zooniversity","l":"Amur Tiger","v":4,"p":"tiger-ridge","h":"Built for a Siberian winter","d":"Amur tigers are the largest tiger subspecies and the most cold-adapted. Ours are at their most active on the days visitors least want to be outside.","s":"Why winter is the best time to visit","b":["Thick coat, heavy fat layer, and a preference for cold means January is peak activity. Fewer than {600} Amur tigers remain in the wild, all in the Russian Far East and northeast China."]},"red-panda":{"t":"Red Panda - Indiana Zooniversity","l":"Red Panda","v":4,"p":"bamboo-forest","h":"Not actually a panda","d":"Red pandas are their own family entirely, more closely related to raccoons than bears. Our two spend most of the day asleep in the upper branches.","s":"Where to look","b":["Scan the canopy, not the ground. Red pandas descend mainly at dawn and dusk, so late-afternoon visits give the best chance of seeing one moving."]},"red-kangaroo":{"t":"Red Kangaroo - Indiana Zooniversity","l":"Red Kangaroo","v":4,"p":"outback-walkabout","c":["joey-development-diary"],"h":"The largest marsupial alive","d":"Adult males reach six feet and cover {25} feet in a single bound. Our mob of nine includes two females currently carrying joeys.","s":"Built to travel far on little","b":["Kangaroo hopping is more efficient the faster they go — tendons store and return energy like springs. It's why they can cross enormous distances in dry country on very little food."]},"africa-projects":{"t":"Africa Projects - Indiana Zooniversity","l":"Africa Projects","v":4,"p":"field-conservation-projects","c":["lion-guardians-partnership","rhino-anti-poaching-fund"],"h":"Six projects across East and Southern Africa","d":"Our largest regional commitment, covering lion coexistence, rhino protection, and community-led habitat work across four countries.","s":"The common thread","b":["Every African project is community-led. Wildlife survives where local people benefit from it surviving, so funding goes to livelihoods and compensation as much as to enforcement."]},"food-webs-unit":{"t":"Food Webs Unit - Indiana Zooniversity","l":"Food Webs Unit","v":4,"p":"lesson-plans","h":"Everything eats something","d":"A three-lesson unit for grades 4–6 building food webs from real species lists in three of our zoo regions.","s":"What students do","b":["Students build a web from an assigned region's species list, then remove one species and trace the consequences through every connection."]},"king-penguin":{"t":"King Penguin - Indiana Zooniversity","l":"King Penguin","v":4,"p":"penguin-coast","h":"The second-largest penguin","d":"Kings stand nearly three feet tall and don't build nests at all — they carry a single egg on their feet for the full incubation period.","s":"Fourteen months to raise one chick","b":["King penguin chicks take over a year to fledge, so pairs breed at most twice every three years. The brown, woolly chicks look like an entirely different species."]},"family-membership":{"t":"Family Membership - Indiana Zooniversity","l":"Family Membership","v":4,"p":"membership-levels","c":["family-plus-benefits"],"h":"The whole household","d":"Covers two named adults and all children under {18} living at the same address, plus one caregiver who doesn't have to be named in advance.","s":"Who counts as family","b":["Two adults at one address and any children under {18} in the household, including foster and grandchildren in your care. {$179} per year."]},"main-visitor-lot":{"t":"Main Visitor Lot - Indiana Zooniversity","l":"Main Visitor Lot","v":4,"p":"parking","h":"Lot A — closest to the gate","d":"Lot A holds {900} cars and is a two-minute walk from the main entrance. It fills first on weekends and holidays.","s":"When Lot A is full","b":["Attendants redirect to Lots B and C automatically. Shuttles run continuously from both lots and are wheelchair accessible."]},"july-lineup":{"t":"July Lineup - Indiana Zooniversity","l":"July Lineup","v":5,"p":"concert-lineup","c":["concert-parking-entry"],"h":"July's five Fridays","d":"July includes both headline nights of the season, which draw the largest crowds and the earliest arrival times of the summer.","s":"Planning for headline nights","b":["Headline Fridays regularly reach capacity by {7:00 PM}. Arrive before {6:00}, or plan on the overflow lawn where the sound is good but the stage isn't visible."]},"symbolic-adoption-kit":{"t":"Symbolic Adoption Kit - Indiana Zooniversity","l":"Symbolic Adoption Kit","v":5,"p":"adoption-packages","c":["kit-contents-shipping"],"h":"What arrives in the mail","d":"A physical package built around your chosen animal — certificate, photograph, fact sheet, plush, and a year of email updates from its care team.","s":"What's in the box","b":["A personalized adoption certificate, an {8x10} photograph of your animal, a species fact sheet, a plush version, and a window decal. Updates arrive quarterly by email."]},"african-elephant":{"t":"African Elephant - Indiana Zooniversity","l":"African Elephant","v":5,"p":"big-mammals","h":"The gardeners of the grassland","d":"Our herd of five moves through eight acres with a deep pool, sand wallows, and a browse forest they strip and reshape daily. No two weeks look the same.","s":"A herd that rearranges its own habitat","b":["Elephants push over trees, dig for minerals, and carve wallows — behaviors we design the habitat to permit rather than prevent. The browse forest is replanted on rotation so there's always something new to dismantle."]},"request-a-date":{"t":"Request a Date - Indiana Zooniversity","l":"Request a Date","v":5,"p":"booking-reservations","c":["confirmation-payment-steps"],"h":"Submit your date request","d":"Requests are reviewed within three business days. Submitting a request holds nothing — availability is confirmed only in the response.","s":"Improving your odds","b":["Offer at least two backup dates and avoid the first two weeks of May, which are booked almost solid by January. Tuesdays and Fridays have the most availability."]},"rhino-anti-poaching-fund":{"t":"Rhino Anti-Poaching Fund - Indiana Zooniversity","l":"Rhino Anti-Poaching Fund","v":5,"p":"africa-projects","h":"Protecting rhinos on the ground","d":"Direct funding for ranger salaries, tracking dogs, and aerial surveillance across two protected reserves holding white and black rhino populations.","s":"What the fund pays for","b":["Ranger salaries and equipment, a four-dog tracking unit, and shared aerial surveillance hours. Rangers are the single highest-impact expense and the hardest to fund."]},"wildlife-investigators-ages-810":{"t":"Wildlife Investigators (Ages 8–10) - Indiana Zooniversity","l":"Wildlife Investigators (Ages 8–10)","v":5,"p":"camp-sessions-ages","h":"Think like a keeper","d":"Campers take on real keeper tasks — building enrichment, recording behavior observations, and preparing diets under supervision.","s":"What campers actually do","b":["Each camper runs a week-long behavior study on one animal, builds two enrichment items that go into real habitats, and presents findings to families on Friday."]},"joey-development-diary":{"t":"Joey Development Diary - Indiana Zooniversity","l":"Joey Development Diary","v":5,"p":"red-kangaroo","h":"Nine months in the pouch","d":"A running record of our two youngest joeys, from first pouch sighting to first steps outside, updated by keepers as each milestone is observed.","s":"What happens in the pouch","b":["A newborn kangaroo is the size of a jellybean and climbs to the pouch unaided. It stays attached to a teat for four months, first looks out at five, and leaves for good around eight."]},"conservation-crew-ages-1113":{"t":"Conservation Crew (Ages 11–13) - Indiana Zooniversity","l":"Conservation Crew (Ages 11–13)","v":5,"p":"camp-sessions-ages","h":"Conservation work, for real","d":"The oldest band spends the week on an actual conservation project — habitat restoration on the zoo grounds, native species monitoring, and a community action plan.","s":"The week's project","b":["Campers work a real restoration site on the zoo's north boundary, collect monitoring data that feeds our records, and finish by designing a conservation action for their own neighborhood."]},"african-lion":{"t":"African Lion - Indiana Zooniversity","l":"African Lion","v":5,"p":"big-mammals","c":["lion-feeding-schedule-keeper-talk"],"h":"The pride of the savanna","d":"Experience the majesty of the world's most iconic social cat. Observe our resident lion pride from the Kopje Overlook and discover what it takes to protect this apex predator.","s":"Apex predators of the open plains","b":["African lions are unique among big cats as the only species that lives in complex social groups known as prides. Led by a coalition of males and a core family of lionesses, prides work together to hunt, defend territory, and raise cubs. At the Metropolitan Zoo, our lions live in a naturalistic habitat modeled after African granite outcrops (kopjes), featuring elevated basking rocks and climate-controlled resting shelters."]},"group-booking-rates":{"t":"Group Booking & Rates - Indiana Zooniversity","l":"Group Booking & Rates","v":5,"p":"group-tickets","c":["group-arrival-day-instructions"],"h":"Reserve your group date","d":"Group reservations open six months ahead and require a two-week lead time. A {25%} deposit holds the date.","s":"Rates by group size","b":["15–49 guests save {20%}, 50–99 save {25%}, and 100 or more save {30%} off gate admission. One chaperone per ten youth is admitted free."]},"junior-explorers-ages-57":{"t":"Junior Explorers (Ages 5–7) - Indiana Zooniversity","l":"Junior Explorers (Ages 5–7)","v":5,"p":"camp-sessions-ages","c":["daily-camp-schedule"],"h":"First week at the zoo","d":"A gentle introduction built around short activities, frequent breaks, and lots of animal contact. Campers meet at least one new animal every day.","s":"What the week looks like","b":["Each day centers on one region of the zoo with a themed craft, a story, and an animal encounter. Groups are capped at {12} for this band with a {1:6} staff ratio."]},"extended-evening-hours":{"t":"Extended Evening Hours - Indiana Zooniversity","l":"Extended Evening Hours","v":5,"p":"summer-hours","c":["late-night-habitat-access"],"h":"Stay past sunset on select nights","d":"On Thursdays and Fridays in July and August the zoo stays open until 9 p.m. with lit pathways, live music at the plaza, and cooler walking weather.","s":"What stays open late","b":["The savanna loop, aquarium, and central plaza dining stay open. Children's areas and the barnyard close at their normal time."]},"zoo-nights-sponsorship":{"t":"Zoo Nights Sponsorship - Indiana Zooniversity","l":"Zoo Nights Sponsorship","v":5,"p":"event-sponsorships","h":"Thirteen Friday nights","d":"Our highest-attendance sponsorship, covering the full summer concert series with title, stage, and per-night sponsor tiers available.","s":"The three tiers","b":["Title sponsorship covers all thirteen nights with naming in the series title. Stage sponsorship covers signage and stage mentions. Per-night sponsorship covers a single Friday."]},"bus-drop-off-procedure":{"t":"Bus Drop-Off Procedure - Indiana Zooniversity","l":"Bus Drop-Off Procedure","v":5,"p":"bus-oversized-vehicles","h":"Unloading at the east curb","d":"Buses stop at the east curb to unload passengers, then move to the parking row. Drivers should stay with the vehicle until the group has cleared the curb.","s":"The unload sequence","b":["Pull into the numbered bay, unload on the curb side only, let the group leader gather everyone at the canopy, then proceed to the driver row. Total curb time is limited to eight minutes."]},"book-a-carnivore-tour":{"t":"Book a Carnivore Tour - Indiana Zooniversity","l":"Book a Carnivore Tour","v":5,"p":"carnivore-care-tour","c":["age-mobility-requirements"],"h":"Reserve a spot","d":"The carnivore tour runs Wednesdays and Saturdays at {9:00 AM}, before the zoo opens. Groups are capped at six and it sells out roughly three weeks ahead.","s":"What booking includes","b":["The {60}-minute tour, early gate access, and general admission for the rest of the day. {$85} per person, {$70} for members."]},"add-on-animal-encounters":{"t":"Add-On Animal Encounters - Indiana Zooniversity","l":"Add-On Animal Encounters","v":5,"p":"keeper-for-a-day-package","h":"Extras you can add","d":"Any package can add a second animal encounter, a giraffe feeding session, or a carousel block for the whole group.","s":"Available add-ons","b":["Second ambassador animal {$75}, giraffe feeding for up to {20} guests {$120}, unlimited carousel for the party window {$60}. Add-ons must be booked at least {7} days ahead."]},"rental-locations-rates":{"t":"Rental Locations & Rates - Indiana Zooniversity","l":"Rental Locations & Rates","v":5,"p":"wheelchair-stroller-rentals","h":"Where to pick up and what it costs","d":"Rentals are handled at two locations — the main gate guest services window and the east gate kiosk. Both accept advance reservations.","s":"Rates and deposits","b":["Manual wheelchairs are free with a photo ID hold. Scooters are {$35} per day, single strollers {$12}, and double strollers {$18}. Return to either location by closing."]},"otter-training-session":{"t":"Otter Training Session - Indiana Zooniversity","l":"Otter Training Session","v":5,"p":"giant-river-otter","h":"Training in the open","d":"Watch keepers run a full husbandry training session at the habitat rail — voluntary weigh-ins, paw presentations, and dental checks, all reinforced with fish.","s":"Why we train medical behaviors","b":["Every behavior demonstrated has a veterinary purpose. Teaching an otter to present a paw or hold still on a scale means routine care happens without sedation or restraint."]},"docent-program":{"t":"Docent Program - Indiana Zooniversity","l":"Docent Program","v":5,"p":"volunteer-roles","c":["docent-training-schedule"],"h":"The people at the rail","d":"Docents are the most visible volunteers — stationed at habitats and interpretive carts, answering questions and running biofact demonstrations all day.","s":"What docents need to know","b":["Docent training is the longest of any track: {40} hours covering animal biology, conservation messaging, and visitor interaction, plus a shadowing period before flying solo."]},"savanna-overlook":{"t":"Savanna Overlook - Indiana Zooniversity","l":"Savanna Overlook","v":5,"p":"ceremony-venues","c":["capacity-layout-options"],"h":"Vows over the grassland","d":"An open-air deck overlooking the savanna habitat, with giraffe and zebra visible behind the ceremony. Golden hour here is the most-requested slot of the year.","s":"What to know about outdoor","b":["The overlook seats up to {200} with no rain cover. Every outdoor booking includes a held indoor backup space at no additional charge, callable up to {4} hours before."]},"reticulated-giraffe":{"t":"Reticulated Giraffe - Indiana Zooniversity","l":"Reticulated Giraffe","v":5,"p":"hoofed-herds","c":["giraffe-feeding-deck"],"h":"The tallest residents","d":"Our four reticulated giraffe browse from feeders set at natural canopy height, and the elevated deck puts you level with their heads.","s":"Feeding from the top down","b":["Giraffe are built to eat where nothing else can reach, so every feeder in the habitat sits above {14} feet. Reticulated giraffe are endangered in the wild, with fewer than {16,000} remaining."]},"lion-guardians-partnership":{"t":"Lion Guardians Partnership - Indiana Zooniversity","l":"Lion Guardians Partnership","v":5,"p":"africa-projects","c":["field-season-report"],"h":"Turning lion hunters into lion protectors","d":"A partnership employing local Maasai warriors to monitor lion movements, reinforce livestock enclosures, and intervene before retaliatory killings happen.","s":"How the program works","b":["Guardians are recruited from the same communities that lose livestock to lions. They track collared animals, warn herders, and repair enclosures — turning conflict into employment."]},"tropical-aviary-hall":{"t":"Tropical Aviary Hall - Indiana Zooniversity","l":"Tropical Aviary Hall","v":5,"p":"ceremony-venues","h":"Married among the macaws","d":"An enclosed ceremony space inside the free-flight aviary, where {40} species of tropical bird move freely above and around your guests.","s":"What it's like inside","b":["Warm, humid, and genuinely loud with birdsong — the aviary is not a quiet room. Seats {120}, climate controlled, and completely weather-independent."]},"underwater-dive-window":{"t":"Underwater Dive Window - Indiana Zooniversity","l":"Underwater Dive Window","v":5,"p":"polar-bear","h":"Eye level with a diving bear","d":"A {30}-foot acrylic window along the deep end of the polar pool. Stand here during a morning enrichment session and the bears will swim within inches of the glass.","s":"Best times to stand here","b":["Enrichment items go into the water at {10:30 AM} and {3:00 PM}, and the bears follow them down. Between sessions the window is quiet and the bears are usually on land."]},"panda-cub-cam":{"t":"Panda Cub Cam - Indiana Zooniversity","l":"Panda Cub Cam","v":5,"p":"giant-panda","c":["cub-milestone-timeline"],"h":"Watch the cub around the clock","d":"Three cameras stream the cub's indoor den and outdoor yard continuously. The feed runs whether or not the zoo is open.","s":"What you'll see and when","b":["Mornings are the most active period — nursing, climbing, and play. Afternoons are almost entirely sleep. Keepers enter the den only for scheduled weigh-ins."]},"interview-training-dates":{"t":"Interview & Training Dates - Indiana Zooniversity","l":"Interview & Training Dates","v":5,"p":"apply-to-volunteer","h":"Mark these dates before applying","d":"Interviews and training are held on fixed dates with no alternates. If you can't make both, wait for the next application cycle.","s":"What to expect at each","b":["Interviews are {20} minutes, in person, conversational rather than technical. Training is a full Saturday covering safety, animal handling basics, and visitor interaction."]},"chimpanzee":{"t":"Chimpanzee - Indiana Zooniversity","l":"Chimpanzee","v":5,"p":"primates","h":"Tool users and problem solvers","d":"Our group of seven uses sticks, stones, and puzzle feeders daily. The termite mound in the habitat is a working enrichment device refilled every morning.","s":"Why the mound matters","b":["Wild chimpanzees fish for termites with modified sticks — one of the first documented cases of animal tool use. Ours do the same thing with honey and mealworms, and juveniles learn by watching adults."]},"kopje-overlook-talks":{"t":"Kopje Overlook Talks - Indiana Zooniversity","l":"Kopje Overlook Talks","v":5,"p":"keeper-talk-locations","c":["accessibility-at-kopje-overlook"],"h":"Talks at the lion overlook","d":"The Kopje Overlook hosts the busiest keeper talk at the zoo, timed to the lion pride's morning feeding. Arrive ten minutes early for a rail spot.","s":"What happens at the overlook","b":["The carnivore team runs the daily feeding and target training session here at {11:00 AM}, narrating the whole thing and taking questions for the last ten minutes."]},"western-lowland-gorilla":{"t":"Western Lowland Gorilla - Indiana Zooniversity","l":"Western Lowland Gorilla","v":5,"p":"primates","h":"A family group, not a collection","d":"Our troop is a single family — one silverback, three females, and two juveniles — living in the structure a wild gorilla family would have.","s":"Reading the troop","b":["Watch for who sits nearest the silverback and who grooms whom; the troop's social map is visible in about ten minutes of observation. Western lowland gorillas are critically endangered."]},"printable-worksheets":{"t":"Printable Worksheets - Indiana Zooniversity","l":"Printable Worksheets","v":5,"p":"animal-adaptations-unit","h":"Download the student materials","d":"All eleven student handouts for the adaptations unit, plus the answer key and a single-page standards map for your lesson binder.","s":"What's in the download","b":["Nine student worksheets, two assessment rubrics, a complete answer key, and an editable version of each handout for teachers who want to adjust reading level."]},"behind-the-scenes-commissary-tour":{"t":"Behind-the-Scenes Commissary Tour - Indiana Zooniversity","l":"Behind-the-Scenes Commissary Tour","v":5,"p":"diet-preparation","c":["tour-booking-requirements"],"h":"See where the food is made","d":"A {45}-minute small-group tour of the commissary kitchen, cold storage, and browse yard with the nutrition team, running three mornings a week.","s":"What the tour covers","b":["Diet formulation, the browse-growing operation, cold storage, and a hands-on portion of preparing one animal's actual daily diet. Groups are capped at eight people."]},"white-rhino":{"t":"White Rhino - Indiana Zooniversity","l":"White Rhino","v":5,"p":"big-mammals","h":"Two tons of grazing machinery","d":"White rhinos have the widest mouth of any rhino species, built for cropping grass close to the ground. Our two females share the plains habitat with the zebra herd.","s":"Square lips and short grass","b":["The name comes from a mistranslation of the Afrikaans for \"wide,\" describing that square mouth. A single white rhino can crop {50} pounds of grass a day, keeping the turf short enough for smaller grazers."]},"plains-zebra":{"t":"Plains Zebra - Indiana Zooniversity","l":"Plains Zebra","v":5,"p":"hoofed-herds","h":"No two are striped alike","d":"Every zebra's stripe pattern is as individual as a fingerprint. Our herd of nine includes two foals born in the last eighteen months.","s":"What the stripes are actually for","b":["Current research points to biting flies rather than camouflage — the pattern disrupts the flight path of tsetse and horseflies. Keepers can identify each animal in the herd by shoulder pattern alone."]},"premium-adoption-kit":{"t":"Premium Adoption Kit - Indiana Zooniversity","l":"Premium Adoption Kit","v":5,"p":"adoption-packages","h":"Meet the animal you sponsor","d":"Everything in the symbolic kit plus a scheduled {30}-minute meeting with the animal's primary keeper and a behind-the-scenes look at its habitat.","s":"How the visit is scheduled","b":["The keeper meeting is booked directly with the care team, usually within six weeks. Visits are limited to four people and depend on the animal's schedule and condition."]},"family-plus-benefits":{"t":"Family Plus Benefits - Indiana Zooniversity  field season report covering lion sightings, livestock incidents prevented, enclosures reinforced, and known mortalities in the study area.","s":"What the season showed","b":["{34} collared lions monitored, {112} livestock enclosures reinforced, {47} potential conflict events defused, and {2} known lion mortalities — the lowest count in {6} seasons."]},"tour-booking-requirements":{"t":"Tour Booking & Requirements - Indiana Zooniversity","l":"Tour Booking & Requirements","v":6,"p":"behind-the-scenes-commissary-tour","h":"Before you book","d":"The commissary is a working food-prep facility, so a few requirements apply to everyone who enters. Read these before reserving a spot.","s":"Requirements for every participant","b":["Ages {12} and up, closed-toe shoes required, hairnets provided and mandatory, and no food allergies to raw fish or produce. The route is fully step-free."]},"capacity-layout-options":{"t":"Capacity & Layout Options - Indiana Zooniversity","l":"Capacity & Layout Options","v":6,"p":"savanna-overlook","h":"How the deck can be arranged","d":"Three standard layouts for the overlook, differing in aisle position and guest capacity. Custom arrangements are possible with a site visit.","s":"The three standard layouts","b":["Center aisle seats {200}, side aisle seats {180} with a wider habitat view, and the in-the-round arrangement seats {140} with the couple at the rail."]},"guest-pass-rules":{"t":"Guest Pass Rules - Indiana Zooniversity","l":"Guest Pass Rules","v":6,"p":"family-plus-benefits","h":"How guest passes work","d":"Guest passes are single-use, non-transferable outside your household, and expire with your membership year. A few limits apply on high-attendance days.","s":"The rules","b":["One pass per guest per visit, a named member must accompany every guest, passes don't cover ticketed events, and unused passes don't roll into the next year."]},"age-mobility-requirements":{"t":"Age & Mobility Requirements - Indiana Zooniversity","l":"Age & Mobility Requirements","v":6,"p":"book-a-carnivore-tour","h":"Read before you book","d":"This tour enters an active carnivore facility, which sets some firm limits on who can participate. These are not negotiable on the day.","s":"Requirements","b":["Ages {14} and up with an adult, or {18} and up unaccompanied. Closed-toe shoes required. The route includes {2} sets of stairs and a {40}-foot gravel stretch with no step-free alternate."]},"giraffe-feeding-deck":{"t":"Giraffe Feeding Deck - Indiana Zooniversity","l":"Giraffe Feeding Deck","v":6,"p":"reticulated-giraffe","h":"Hand-feed a giraffe","d":"Step onto the elevated deck and offer lettuce to the herd from an arm's length away. Sessions run twice daily and sell out most summer weekends.","s":"How a session works","b":["Groups of ten enter the deck for a fifteen-minute session with a keeper. Lettuce is provided; outside food is not permitted. Giraffe participate voluntarily and sessions end when they lose interest."]},"daily-camp-schedule":{"t":"Daily Camp Schedule - Indiana Zooniversity","l":"Daily Camp Schedule","v":6,"p":"junior-explorers-ages-57","h":"Hour by hour","d":"The Junior Explorers day runs {9:00 AM} to {3:30 PM} with supervised drop-off from {8:00} and pickup until {5:30}. Here's the full schedule."},"concert-parking-entry":{"t":"Concert Parking & Entry - Indiana Zooniversity","l":"Concert Parking & Entry","v":6,"p":"july-lineup","h":"Getting in on a concert night","d":"Concert nights use a different entry pattern than daytime visits. The main lot fills first and the east gate handles most evening arrivals.","s":"Where to park and enter","b":["Lot A closes to new arrivals at {6:00 PM} on concert nights. Use Lots B and C with the shuttle, or the east lot which stays open all evening and is a shorter walk to the plaza."]},"group-arrival-day-instructions":{"t":"Group Arrival Day Instructions - Indiana Zooniversity","l":"Group Arrival Day Instructions","v":6,"p":"group-booking-rates","h":"What to do when your   const SIDENAV_CHEVRON = svg('-3.69 0 16 16', `<path d="${ICON_16['chevron-right']}"/>`);
  const SIDENAV_CHEVRON_DOWN = svg('0 -3.69 16 16', `<path d="${ICON_16['chevron-down']}"/>`);

  const icon = (name) => ICON_MARKUP[name] || '';

  /** Hydrate every `data-icon` placeholder inside a root (including the shell). */
  function paintIcons(root) {
    for (const el of root.querySelectorAll('[data-icon]')) {
      if (!el.firstChild) el.innerHTML = icon(el.dataset.icon);
    }
  }

  /* =========================================================================
     HELPERS
     ========================================================================= */
  const esc = (s) =>
    String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /** Hash route for a slug. Home is "#/" so the URL stays clean. */
  const href = (slug) => (slug === HOME ? '#/' : '#/' + slug);

  const hasKids = (slug) => (PAGES[slug].c || []).length > 0;

  /** Root → page chain of slugs, inclusive. */
  function ancestry(slug) {
    const chain = [];
    for (let s = slug; s; s = PAGES[s].p) chain.unshift(s);
    return chain;
  }

  /**
   * Live prototype-05 nav model (re-checked 2026-09-11).
   * Home / depth-1: top-level siblings. Depth 2+: parent's children.
   * Current branch with kids expands in place. Back only below depth 1.
   */
  function navModel(slug) {
    const isHome = slug === HOME;
    const parent = isHome ? null : PAGES[slug].p;
    const atTop = isHome || !parent || parent === HOME;
    return {
      items: atTop ? (PAGES[HOME].c || []) : (PAGES[parent].c || []),
      back: atTop || !parent ? null : { slug: parent, label: 'Back to ' + PAGES[parent].l },
      expanded: !isHome && hasKids(slug) ? slug : null,
      current: isHome ? null : slug,
    };
  }

  /* =========================================================================
     BREADCRUMBS  (spec 9, `rvt-breadcrumbs`)
     First crumb is a house glyph whose only content is sr-only "Home"; the last
     crumb is a plain <li aria-current="page"> with no <a>, exactly as the
     source emits it. Deep trails truncate to house + "…" + last two, matching
     the Figma exports for the level-5/6 pages, per the designer's note
     "Truncated Breadcrumbs: Prevents multi-line wrapping; preserves key
     context". The crumbs Figma switches off are kept as sr-only <li>s so the
     announced trail is still the source's full one. The ellipsis chip is a
     button that toggles the full trail: first click reveals every crumb as a
     normal list item (chip stays so a second click collapses); shallow pages
     already show the whole trail and have no chip.

     RECONCILED: aria-label="Show all breadcrumbs" on the chip — necessary
     control name; Rivet, layout.css, and the source prototype have no string
     for this control.

     MEASURED against frames 3/4/8 (exported at 1:1 / 0.875 / 0.875). Every
     number below is a pixel reading, not a guess:

       row              left edge x=404 (= content column 324 + hero pl-80),
                        item height 20px, 12px above the H1 box (`pb-3`)
       gaps             4px between every item, and between a chevron and the
                        label after it — Rivet's own CSS says the same
                        (`.rvt-breadcrumbs{gap:8px 4px}` + `li{gap:4px}`), so
                        the 8px is the row-gap that only shows if it wraps
       home glyph       12x12 at x=404…415, fill #1F2528
       separator        12x12 chevron-right, fill #990000 (crimson), i.e. the
                        rules and the arrows are crimson but the words are not
       link crumb       T18 14/20 350, #1F2528, NO underline. Verified by row:
                        under "Animals & Habitats" in frame 4 there is no ink
                        at all in the underline rows, while the last crumb has
                        a solid 1px rule there
       current crumb    T18 14/20 350, #990000, underlined. Same weight as the
                        links: "Animals & Habitats" measures 121.2px as a link
                        (frame 4) and 122px as the current item (frame 3), so
                        the crimson + underline is the whole difference
       truncation pill  36x20 box with a 1px #F0E1CC border, holding the 12px
                        ellipsis glyph in #1F2528 — a bordered chip, not a bare
                        row of dots

     RECONCILED: spec 9's table gives the link crumbs the current item's
     treatment (crimson + underline). The exports disagree with it, and the
     live site's CSS backs the exports — `.rvt-breadcrumbs li a` is theme text
     with `text-decoration:none`, turning crimson + underlined only on
     `:hover`, which is also why the home glyph reads crimson in frames 6-8
     (it is `currentColor` on a hovered link) and dark in frames 3-5. Render
     the default state; hover reproduces the other one.
     ========================================================================= */
  let crumbsExpanded = false;

  function renderBreadcrumbs(slug) {
    const chain = ancestry(slug);
    if (chain.length < 2) return ''; // Home has no breadcrumbs in the source.

    const rest = chain.slice(1);
    // Figma switches the middle crumbs off rather than deleting them (the
    // layers are there with `visible: false`), so they stay in the list as
    // sr-only text: the trail on screen is the design's house + "…" + last
    // two, the trail announced is the source's full one. sr-only is absolutely
    // positioned, so a hidden crumb is not a flex item and adds no gap.
    // Toggling the chip unhides those items as ordinary linked crumbs.
    const hidden = rest.length > 3 ? rest.length - 2 : 0;
    const collapsed = hidden > 0 && !crumbsExpanded;

    const sep = `<span data-icon="chevron-right" class="block size-3 shrink-0 text-crimson"></span>`;
    let out =
      `<li class="flex h-5 items-center">` +
      `<a class="flex items-center py-1 text-ink hover:text-crimson" href="#/">` +
      `<span class="sr-only">Home</span>` +
      `<span data-icon="home" class="block size-3"></span></a></li>`;

    if (hidden) {
      out +=
        `<li class="flex h-5 items-center gap-1">${sep}` +
        `<button type="button" data-crumbs-toggle aria-expanded="${crumbsExpanded ? 'true' : 'false'}" ` +
        `aria-label="Show all breadcrumbs" ` +
        `class="flex h-5 w-9 appearance-none items-center justify-center border border-cream bg-transparent p-0 text-ink">` +
        `<span data-icon="ellipsis" class="block size-3"></span></button></li>`;
    }

    rest.forEach((s, i) => {
      const label = esc(PAGES[s].l);
      if (collapsed && i < hidden) {
        out += `<li class="sr-only">${label}</li>`;
        return;
      }
      out += i === rest.length - 1
        ? `<li aria-current="page" class="flex h-5 items-center gap-1">${sep}` +
          `<span class="t18 text-crimson underline decoration-1 underline-offset-2">${label}</span></li>`
        : `<li class="flex h-5 items-center gap-1">${sep}` +
          `<a data-nav class="t18 text-ink decoration-1 underline-offset-2 hover:text-crimson hover:underline" href="${href(s)}">${label}</a></li>`;
    });

    return `<rvt-breadcrumbs><nav aria-label="Breadcrumbs" class="pb-3">` +
           `<ol class="flex flex-wrap items-center gap-x-1 gap-y-2">${out}</ol></nav></rvt-breadcrumbs>`;
  }

  /* =========================================================================
     MAIN CONTENT
     Home uses `rvt-hero-statement` (centred, H1 + lede + CTA + image,
     spec 9); every other page uses `rvt-hero-feature` (breadcrumbs + H1 + lede).
     Source `e` eyebrows are kept in SITE but not rendered in the main column.
     Body copy is the source's single `.rvt-rich-text` h2 + paragraph.
     ========================================================================= */

  /** Home hero — spec 9, "Home hero (rvt-hero-statement)". */
  function renderHome(p) {
    // The source h1 is sentence case; the live site renders it in the uppercase
    // display style, so the caps come from CSS and the string stays verbatim.
    // Eyebrows (`p.e`) are not shown in the main column.
    const actions = (p.a || [])
      .map(
        (a) =>
          `<a data-nav href="${href(a.h)}" class="nav-btn-hero flex h-12 items-center gap-2 bg-crimson px-4 text-white">` +
          `<span class="t14">${esc(a.l)}</span>` +
          `<span data-icon="arrow-right" class="block size-4 shrink-0"></span></a>`
      )
      .join('');

    const image = p.i
      ? `<figure class="rvt-hero__figure"><div class="rvt-hero__images">` +
        // Mobile pins the hero image to a fixed 200px (spec 12.5); desktop keeps
        // the source asset's native 2:1 ratio.
        `<img class="h-[200px] w-full object-cover object-center lg:aspect-[2/1] lg:h-auto" src="${esc(p.i.s)}" ` +
        `alt="${esc(p.i.a)}" width="1200" height="600" loading="lazy" decoding="async" sizes="100vw"></div></figure>`
      : '';

    return (
      `<div class="rvt-hero rvt-hero--statement bg-white pb-16">` +
      `<div class="mx-auto max-w-[1600px] px-4 lg:px-20">` +
      // pb-8 is live's 32px gap down to the hero figure.
      `<div class="flex flex-col items-center pb-8 pt-16 text-center lg:pt-[108px]">` +
      `<h1 class="rvt-hero__title hero-title-display text-crimson">${esc(p.h)}</h1>` +
      `<p class="rvt-hero__teaser mt-5 hero-lede-lg text-body">${esc(p.d)}</p>` +
      (actions ? `<div class="rvt-hero__actions flex flex-wrap justify-center gap-4 pt-10">${actions}</div>` : '') +
      `</div>` +
      image +
      `</div></div>`
    );
  }

  /** Interior hero + body — spec 9, "Interior hero (rvt-hero-feature)". */
  function renderInterior(slug, p) {
    // Depth 0-1 (home + the five top-level sections) carry the slanted
    // uppercase display H1; every deeper page uses the upright sentence-case
    // one. The Figma exports agree (frames 1-3 uppercase-slanted, 4-8 upright),
    // and so does the live site, which reaches the same split structurally:
    // only those six pages get the `rvt-hero--feature`/`--statement` modifier
    // that swaps the title style. The strings themselves are verbatim — the
    // five section pages ship ALL-CAPS h1s in the source HTML (content-ia.md,
    // Appendix A2), the rest sentence case.
    const h1Class = p.v <= 1 ? 'hero-title-display' : 'hero-title';

    const image = p.i
      ? `<figure class="rvt-hero__figure mt-8"><div class="rvt-hero__images">` +
        // Mobile pins the hero image to a fixed 200px (spec 12.5); desktop keeps
        // the source asset's native 2:1 ratio.
        `<img class="h-[200px] w-full object-cover object-center lg:aspect-[2/1] lg:h-auto" src="${esc(p.i.s)}" ` +
        `alt="${esc(p.i.a)}" width="1200" height="600" loading="lazy" decoding="async" sizes="100vw"></div></figure>`
      : `\n<!-- GAP: Figma frames 4-8 show a feature photograph under the hero on\n` +
        `     interior pages. Only 6 of the 216 source pages carry an <img> (Home\n` +
        `     and the five top-level sections) — content-ia.md, Appendix A5: "No\n` +
        `     images on any of the 210 non-top-level pages". No asset and no alt\n` +
        `     text exist for this slot, so it is left empty. -->\n`;

    const bodyParas = (p.b || []).map((t) => `<p class="pt-4 t11 text-body">${esc(t)}</p>`).join('');
    const richText =
      p.s || bodyParas
        // mt-8 is live's `main .rvt-rich-text { margin-block-start: 32px }` —
        // the gap from the hero down to the body copy.
        ? `<div class="rvt-rich-text max-w-[950px] mt-8">` +
          (p.s ? `<h2 class="t6 text-ink">${esc(p.s)}</h2>` : '') +
          bodyParas +
          `</div>`
        : `\n<!-- GAP: this page has no .rvt-rich-text block in the source (9 of the\n` +
          `     216 pages do not) — hero copy is the entire page content. -->\n`;

    return (
      `<div class="rvt-hero rvt-hero--feature interior-content px-4 pb-10 pt-6 lg:pb-12 lg:pl-20 lg:pr-10">` +
      renderBreadcrumbs(slug) +
      // No max-width on the h1: live's 54rem measure explicitly exempts the
      // title (`.rvt-hero__body > :not(.rvt-hero__title)`) and lets it run to
      // the full content width. Eyebrows (`p.e`) are not shown above it.
      `<h1 class="rvt-hero__title ${h1Class} text-crimson">${esc(p.h)}</h1>` +
      `<p class="rvt-hero__teaser mt-5 hero-lede text-body">${esc(p.d)}</p>` +
      image +
      richText +
      `\n<!-- GAP: spec 11 and spec 13.8 describe further body components used on\n` +
      `     these frames — rvt-stat, rvt-callout, rvt-timeline, rvt-section-intro,\n` +
      `     rvt-text-essay, rvt-media-hub, rvt-list-hub, rvt-billboard, rvt-quote.\n` +
      `     The source pages contain no content for any of them: main holds one\n` +
      `     hero plus one h2 and one paragraph, with no lists, tables or cards\n` +
      `     anywhere (content-ia.md, Appendix A5). Building them would mean\n` +
      `     authoring copy, so they are omitted. -->\n` +
      `</div>`
    );
  }

  /* =========================================================================
     SIDENAV — live prototype-05 sibling index (Figma 1436:244217 type/spacing)
     Parent click navigates. Current branch with children expands in place
     (chevron-down). Other parents get chevron-right. Nested children have
     no chevron. No Overview row. Cream hairlines #F0E1CC, 12px row py.
     ========================================================================= */
  function renderNavBack(back) {
    if (!back) return '';
    return (
      `<a data-nav href="${href(back.slug)}" ` +
      `class="nav-btn-back inline-flex h-6 items-center gap-2 text-ink">` +
      `<span data-icon="arrow-left" class="block size-3 shrink-0"></span>` +
      `<span class="t16">${esc(back.label)}</span></a>`
    );
  }

  function chevronKind(itemSlug, model) {
    if (model.expanded === itemSlug) return 'down';
    if (hasKids(itemSlug)) return 'right';
    return null;
  }

  function renderSidenav(slug) {
    const model = navModel(slug);
    const items = model.items
      .map((s) => {
        const current = s === model.current;
        const expanded = s === model.expanded;
        const kind = chevronKind(s, model);
        const chev =
          kind === 'down'
            ? `<span data-icon="chevron-down" class="block size-4 shrink-0" aria-hidden="true"></span>`
            : kind === 'right'
              ? `<span data-icon="chevron-right" class="block size-4 shrink-0" aria-hidden="true"></span>`
              : '';
        const kids = expanded
          ? `<ul>` +
            (PAGES[s].c || [])
              .map(
                (c) =>
                  `<li>` +
                  `<a data-nav href="${href(c)}" class="sidenav-child flex items-center gap-2 pl-4 text-ink hover:underline">` +
                  `<span class="t18 min-w-0 flex-1 whitespace-normal">${esc(PAGES[c].l)}</span></a></li>`
              )
              .join('') +
            `</ul>`
          : '';
        return (
          `<li class="-mb-px border-y border-cream">` +
          `<a data-nav href="${href(s)}"${current ? ' aria-current="page"' : ''} ` +
          `class="sidenav-item flex items-center gap-2 px-0 hover:underline ${current ? 'text-crimson' : 'text-ink'}">` +
          `<span class="t-sidenav-parent min-w-0 flex-1 whitespace-normal${current ? ' underline' : ''}">${esc(PAGES[s].l)}</span>` +
          `${chev}</a>${kids}</li>`
        );
      })
      .join('');

    return renderNavBack(model.back) + `<div class="${model.back ? 'pt-6' : ''}"><ul>${items}</ul></div>`;
  }

  /* =========================================================================
     MOBILE SIDENAV — the same rail as desktop (Figma 1436:244282), not a
     second Menu & Search header. Overlay + scrim below 1024px.
     ========================================================================= */
  const sidenav = document.getElementById('sidenav');
  const sidenavNav = document.getElementById('sidenav-nav');
  const sidenavOpenBtn = document.getElementById('sidenav-open');
  const scrim = document.getElementById('scrim');
  const searchInput = document.getElementById('site-search');
  const desktopNav = window.matchMedia('(min-width: 1024px)');
  let mobileSidenavOpen = false;

  function hideScrimIfIdle() {
    if (mobileSidenavOpen) return;
    scrim.classList.add('opacity-0');
    scrim.classList.remove('pointer-events-auto');
    document.body.classList.remove('overflow-hidden');
    setTimeout(() => { if (!mobileSidenavOpen) scrim.hidden = true; }, 250);
  }

  function showScrim() {
    scrim.hidden = false;
    requestAnimationFrame(() => {
      scrim.classList.remove('opacity-0');
      scrim.classList.add('pointer-events-auto');
    });
    document.body.classList.add('overflow-hidden');
  }

  function openMobileSidenav() {
    if (desktopNav.matches) return;
    mobileSidenavOpen = true;
    sidenav.classList.add('is-open');
    document.body.classList.add('sidenav-open');
    sidenavOpenBtn.setAttribute('aria-expanded', 'true');
    showScrim();
    const lockup = sidenav.querySelector('.sidenav-lockup');
    if (lockup) lockup.focus();
  }

  function closeMobileSidenav() {
    if (!mobileSidenavOpen) return;
    mobileSidenavOpen = false;
    sidenav.classList.remove('is-open');
    document.body.classList.remove('sidenav-open');
    sidenavOpenBtn.setAttribute('aria-expanded', 'false');
    hideScrimIfIdle();
    if (sidenav.contains(document.activeElement)) sidenavOpenBtn.focus();
  }

  sidenavOpenBtn.addEventListener('click', () => {
    mobileSidenavOpen ? closeMobileSidenav() : openMobileSidenav();
  });
  scrim.addEventListener('click', closeMobileSidenav);
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const t = e.target;
    if (t && t.tagName === 'INPUT' && t.type === 'search' && t.value.length > 0) return;
    if (mobileSidenavOpen) closeMobileSidenav();
  });
  desktopNav.addEventListener('change', (e) => {
    if (e.matches) closeMobileSidenav();
  });

  /* Search form — no backend in the prototype; submit is swallowed. */
  searchInput.form.addEventListener('submit', (e) => e.preventDefault());

  /* =========================================================================
     ROUTER
     Hash routes: "#/" is Home, "#/<slug>" is any other page. Non-route hashes
     (the skip link's "#main-content") are ignored so they still behave as
     in-page anchors.
     ========================================================================= */
  function currentSlug() {
    const h = location.hash;
    if (!h || h === '#' || h === '#/') return HOME;
    if (!h.startsWith('#/')) return null; // in-page anchor, not a route
    const slug = decodeURIComponent(h.slice(2)).replace(/\/$/, '');
    return PAGES[slug] ? slug : HOME;
  }

  const main = document.getElementById('main-content');

  function render() {
    const slug = currentSlug();
    if (slug === null) return; // anchor jump, leave the page alone
    crumbsExpanded = false;
    const p = PAGES[slug];
    document.title = p.t;

    const isHome = slug === HOME;
    const model = navModel(slug);
    sidenavNav.innerHTML = renderSidenav(slug);
    document.body.classList.add('has-sidenav');
    document.body.classList.toggle('has-sidenav-back', !!model.back);
    sidenav.setAttribute('aria-label', isHome ? 'Menu' : PAGES[slug].l);

    main.innerHTML = isHome ? renderHome(p) : renderInterior(slug, p);
    paintIcons(main);
    paintIcons(sidenavNav);
  }

  // Any in-app link closes the mobile sidebar and scrolls to top; the hash
  // change does the actual routing. The breadcrumb chip toggles the trail.
  document.addEventListener('click', (e) => {
    const crumbBtn = e.target.closest('[data-crumbs-toggle]');
    if (crumbBtn) {
      crumbsExpanded = !crumbsExpanded;
      const slug = currentSlug();
      const host = main.querySelector('rvt-breadcrumbs');
      if (host && slug) {
        host.outerHTML = renderBreadcrumbs(slug);
        const next = main.querySelector('rvt-breadcrumbs');
        if (next) {
          paintIcons(next);
          const btn = next.querySelector('[data-crumbs-toggle]');
          if (btn) btn.focus();
        }
      }
      return;
    }
    const a = e.target.closest('a[data-nav]');
    if (!a) return;
    if (mobileSidenavOpen) closeMobileSidenav();
    if (a.getAttribute('href') === location.hash) { e.preventDefault(); return; }
    window.scrollTo(0, 0);
  });

  // Skip link: move focus without hijacking the router's hash.
  document.querySelector('.rvt-skip-link').addEventListener('click', (e) => {
    e.preventDefault();
    main.setAttribute('tabindex', '-1');
    main.focus();
  });

  window.addEventListener('hashchange', render);

  paintIcons(document);
  render();

  // Small console self-check: every page reachable, every link resolving.
  const total = Object.keys(PAGES).length;
  const seen = new Set([HOME]);
  const walk = (s) => (PAGES[s].c || []).forEach((c) => { if (!seen.has(c)) { seen.add(c); walk(c); } });
  walk(HOME);
  console.info(
    `[prototype] ${total} pages loaded, ${seen.size} reachable by walking the nav tree from Home` +
      (seen.size === total ? '' : ` — UNREACHABLE: ${Object.keys(PAGES).filter((s) => !seen.has(s)).join(', ')}`)
  );
})();
</script>
</body>
</html>
