<!DOCTYPE html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indiana Zooniversity</title>

<!--
  ===========================================================================
  Indiana Zooniversity — prototype-05 source-behavior nav
  ===========================================================================

  Fourth family prototype. Chrome tokens come from zoo-header / v1; interaction
  is the live site at https://basham.github.io/rivet-2026-06-17/prototype-05/
  (re-checked 2026-09-11 — the older content-ia.md drill-down notes are stale).
  Visual pieces in Figma 1436:242642 (file lA01Bv7AUPkAJmblZoKTpe) plus family
  tokens: cream #F0E1CC, 350px sidenav, 40px pad, 12px row py, 16px chevrons.
  Figma hides rvt-header — lockup, search, sibling index, and CTAs all live
  in the sticky left sidebar (frames 1436:242648 / 1436:244282).

  BEHAVIOR (live prototype-05, not v1 / zoo-header)
  -------------------------------------------------
  Sidenav is a current-section sibling index, not a full tree and not an
  accordion. Parent click always navigates. The current branch (if it has
  children) expands in place with a chevron-down; siblings that have children
  show chevron-right; leaves have no chevron. Nested children never show a
  chevron. Back is "Back to {parent}" except on Home and the five top-level
  sections. No Overview row. No Conservation & Wildlife Care. Drawer shows
  the same list and also navigates — it does not drill without changing page.

  EVERY VISIBLE STRING is verbatim from those sources. No copy was authored for
  this prototype. Where the Figma design has a slot the source site has no content
  for, the slot is left out and marked with a `GAP:` comment in the markup rather
  than filled with placeholder text. Search this file for "GAP:" and "RECONCILED:"
  to find all of them.

  FONTS
  -----
  The real site self-hosts "Roboto Flex Variable" and "Roboto Mono Variable"
  (Fontsource woff2, confirmed via @font-face in layout.css), which is the same
  pair the Figma file specifies. Both are variable fonts available from Google
  Fonts, so they are linked below and NO SUBSTITUTION WAS MADE. The design leans
  hard on Roboto Flex's `wdth`, `opsz` and `slnt` axes — see the .t1–.t18 classes.

  DATA
  ----
  All 216 pages are data-driven from one embedded object (`SITE`) rendered through
  one template. That object is generated by tools/build-data.mjs; see the
  @generated:site-data block near the bottom of this file.
-->

<!-- Roboto Flex (variable: opsz, slnt, wdth, wght) + Roboto Mono — spec 3. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,slnt,wdth,wght@8..144,-10..0,25..151,100..1000&family=Roboto+Mono:wght@300..700&display=swap">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  /*
    THE DESKTOP BREAKPOINT — one literal, three consumers.
    ------------------------------------------------------
    1024px is the width at which the left sidenav is in-flow and sticky.
    Below it, the same sidebar opens as an overlay (Figma 393 frame is this
    rail, not a second Menu & Search header). Tailwind's `lg:` utilities, the
    `@media screen(lg)` type-scale blocks, and the overlay matchMedia query
    all share this number.
  */
  const SIDENAV_BREAKPOINT = 1024;

  /* Design tokens — spec 2 (colour) and spec 16 (values needing config). */
  tailwind.config = {
    theme: {
      extend: {
        screens: {
          lg: SIDENAV_BREAKPOINT + 'px',
        },
        colors: {
          crimson: '#990000',      // brand/main   — H1s, CTAs, current nav item, footer band
          'crimson-dk': '#6D0808', // brand/dark   — footer divider
          cream: '#F0E1CC',        // brand/light  — every hairline rule
          ink: '#1F2528',          // base/main    — headings, dark buttons, borders
          body: '#343C42',         // theme/text   — body copy
        },
        fontFamily: {
          sans: ['"Roboto Flex"', 'system-ui', 'sans-serif'],
          mono: ['"Roboto Mono"', 'ui-monospace', 'monospace'],
        },
      },
    },
  };
</script>

<style type="text/tailwindcss">
  /* =========================================================================
     NAMED TEXT STYLES — spec 3, "Named text styles → usage map" (T1–T18)
     -------------------------------------------------------------------------
     Each Figma text style becomes one class. `font-variation-settings` carries
     the weight as an explicit 'wght' axis rather than relying on font-weight,
     because the design uses off-ramp weights (350 / 650 / 825) and because
     font-variation-settings wins over font-weight per-axis — keeping both in
     one declaration removes any ambiguity.

     Responsive pairs come from spec 12.4 (the same Figma variable resolves to a
     smaller value inside the 375px frames). The breakpoint is 1024px, per the
     designer's note "Section menu mobile breakdown: breaks at either 1024 OR
     768" — 1024 chosen, and used consistently for both type and layout. It is
     spelled `screen(lg)` below so it resolves from `SIDENAV_BREAKPOINT` above
     rather than repeating the literal.
     ========================================================================= */

  /* T1 — Custom/lockup/campus-title. wdth 35 is what makes the lockup narrow. */
  .t1  { font-size:16px; line-height:16px; letter-spacing:.25px; text-transform:uppercase;
         font-variation-settings:'wght' 700,'wdth' 35; }
  /* T2 / T3 — Tag/uppercase, Roboto Mono, 2px tracking. */
  .t2  { font-family:'Roboto Mono',ui-monospace,monospace; font-size:14px; line-height:14px;
         letter-spacing:2px; text-transform:uppercase; font-variation-settings:'wght' 350; }
  .t3  { font-family:'Roboto Mono',ui-monospace,monospace; font-size:12px; line-height:12px;
         letter-spacing:2px; text-transform:uppercase; font-variation-settings:'wght' 350; }
  /* T4 — Display/extra-large/strong-uppercase. Figma reports not-italic but the
     render measures -10.3deg, exactly Roboto Flex's slnt limit (spec 3, 13.4). */
  .t4  { font-size:36px; line-height:36px; text-transform:uppercase;
         font-variation-settings:'wght' 825,'wdth' 100,'opsz' 54,'slnt' -10; }
  /* T5 — Display/large/strong-sentence. Upright: the slant applies only to T4.
     Mobile 29/32 is inferred from the token pair `type/size/29-48` (spec 12.4);
     no 375px frame shows this style, so that value is the spec's inference. */
  .t5  { font-size:29px; line-height:32px;
         font-variation-settings:'wght' 700,'wdth' 100,'opsz' 48; }
  /* T6 — Display/small/strong. */
  .t6  { font-size:29px; line-height:32px; font-variation-settings:'wght' 700,'wdth' 100,'opsz' 29; }
  /* T7 / T8 — drawer title, desktop / mobile. */
  .t-drawer-title { font-size:23px; line-height:28px; font-variation-settings:'wght' 700,'wdth' 100; }
  /* T9 — Body/medium/regular (home lede). */
  .t9  { font-size:20px; line-height:28px; font-variation-settings:'wght' 350,'wdth' 110; }
  /* T10 — Body/base/regular (interior lede). */
  .t10 { font-size:16px; line-height:24px; font-variation-settings:'wght' 350,'wdth' 110; }
  /* T11 / T12 — Body/small/regular, and the search-drawer placeholder. */
  .t11 { font-size:16px; line-height:24px; font-variation-settings:'wght' 350,'wdth' 110; }
  /* T13 — Action/extra-large/strong: drawer level-1 nav item. */
  .t13 { font-size:20px; line-height:24px; font-variation-settings:'wght' 600,'wdth' 115; }
  /* T14 — Action/large/strong: button labels, section headings, current L2+ item. */
  .t14 { font-size:16px; line-height:24px; font-variation-settings:'wght' 600,'wdth' 115; }
  /* T15 — Action/large/regular. */
  .t15 { font-size:16px; line-height:24px; font-variation-settings:'wght' 350,'wdth' 115; }
  /* T16 — Action/small/strong: drawer Back (and Main menu escape). */
  .t16 { font-size:14px; line-height:20px; font-variation-settings:'wght' 600,'wdth' 115; }
  /* Sidenav Back label only — T16 axes at 12/16 (`text-xs`). Drawer stays T16. */
  .t-sidenav-back { font-size:12px; line-height:16px; font-variation-settings:'wght' 600,'wdth' 115; }
  /* T17 — Action/small/regular: footer legal links. */
  .t17 { font-size:14px; line-height:20px; font-variation-settings:'wght' 350,'wdth' 115; }
  /* T18 — action/medium/regular: sidenav items, breadcrumb links. */
  .t18 { font-size:14px; line-height:20px; font-variation-settings:'wght' 350,'wdth' 112.5; }

  /* Sidenav section heading — T14 axes at 16/20 600 (one step tighter than
     T14's 16/24 so wrapped titles sit closer). Only ever visible at >=lg
     (the column is `hidden` below that), so it carries no mobile pair. */
  .t-section-heading { font-size:16px; line-height:20px; font-variation-settings:'wght' 600,'wdth' 115; }

  /* -------------------------------------------------------------------------
     DRAWER DRILL-DOWN TYPE (level 2+) — measured, not read off the spec table.
     spec 8 tabulates one set of values for these ("52px rows, heading T14
     16/24 600, item T15 16/24 350"). Those hold in the 375px mobile frame
     (`1381:87363`, exported 1:1) but NOT in the six 533.33px desktop panels:
     re-measuring the exports at design scale gives a 55px rule-to-rule stride
     (= 56px rows) and visibly larger type. Fitting the ink widths of five
     heading strings and three item labels against live Roboto Flex pins them
     down (all within +-1.7px, the glyph side-bearings):

       heading  "Africa" 53.5px, "Animals & Habitats" 177.8px, "Big Mammals"
                126.5px, "African Lion" 110.2px, "Grasslands & Plains" 183.3px
                -> 20px / wght 700 / wdth 100   (mobile: 18px, same axes,
                   from "Animals & Habitats" at 160.0px 1:1)
       item     "Grasslands & Plains" 157.1px, "Rainforests & Woods" 165.8px,
                "Deserts & Dry Lands" 161.5px
                -> 18px / wght 350 / wdth 115   (mobile: 16px, from "Africa"
                   at 41.0px and the current row at 220.0px, both 1:1)

     16 -> 18 and 24 -> 28 are exactly the `--rvt-ts-18` / `line-height/28`
     token pairs in spec 12.4, so the desktop panels are the same component
     resolving its type tokens in desktop mode. The heading's 18 -> 20 pair is
     not in the spec's token list; it is what the pixels give.

     The heading size is user-tuned to 23/28 (same 700/100 axes as the
     measured 18/23 and 20/23 pairs). Line-height stays tight so wraps do
     not collide, matching the 23:28 proportion already used by `.t-drawer-title`.
     ------------------------------------------------------------------------- */
  .t-drawer-heading      { font-size:23px; line-height:28px; font-variation-settings:'wght' 700,'wdth' 100; }
  .t-drawer-item         { font-size:16px; line-height:24px; font-variation-settings:'wght' 350,'wdth' 115; }
  .t-drawer-item-current { font-size:16px; line-height:24px; font-variation-settings:'wght' 600,'wdth' 115; }

  @media screen(lg) {
    .t4  { font-size:54px; line-height:56px; }
    .t5  { font-size:48px; line-height:52px; }
    .t10 { font-size:18px; line-height:28px; }
    .t-drawer-title   { font-size:29px; line-height:36px; font-variation-settings:'wght' 700,'wdth' 100,'opsz' 14; }
    .t-drawer-item         { font-size:18px; line-height:28px; }
    .t-drawer-item-current { font-size:18px; line-height:28px; }
  }

  /* =========================================================================
     MAIN-CONTENT HERO TYPE — the LIVE SITE is the authority here
     -------------------------------------------------------------------------
     Everything above is measured against the Figma file. This block is not:
     for the hero region the authority is the live page's own computed styles,
     read back from
       https://basham.github.io/rivet-2026-06-17/prototype-05/plan-your-visit/
     and cross-checked against the rules in its compiled layout.css. Where the
     live site and Figma disagree, the live site wins — see the RECONCILED
     notes on each class.

     These are separate hero-scoped classes rather than edits to T2/T4/T5/T9/
     T10 on purpose. The T-scale is the Figma record and it is what renders the
     masthead, drawer, sidenav, breadcrumbs and footer, so re-pointing the hero
     at live values cannot move any navigation. T2/T4/T5/T9/T10 are now unused,
     as T3 and T15 already were — the scale documents all 18 Figma styles, not
     just the ones this prototype consumes.

     The fluid `clamp()` expressions are the live site's own size tokens copied
     verbatim (`--rvt-size-12-14`, `-36-54`, `-40-56`, `-29-48`, `-32-52`,
     `-16-18`, `-18-20`, `-24-28`), so these track the live page at every
     viewport width instead of stepping at the 1024px breakpoint.

     Weight and width are set with `font-weight` / `font-stretch` here, not with
     an explicit 'wght'/'wdth' axis as the T-scale does. That is deliberate: it
     is how the live site sets them, so the computed values now match it
     property-for-property. It also leaves `font-optical-sizing` at its `auto`
     default, which is what the live site relies on — the T-scale pinned `opsz`
     to the desktop font-size, which was wrong at mobile sizes.
     ========================================================================= */

  /* Eyebrow — live `.rvt-hero__eyebrow`. RECONCILED: Figma's T2 tag style is
     Roboto Mono 14/14 with 2px tracking; the live site ships Roboto Mono
     12→14 fluid on a 16px line box with `.12em` tracking (= 1.68px at 14px).
     Live wins. `max-width` is live's `.rvt-hero__body > :not(.rvt-hero__title)`
     54rem measure. Casing comes from CSS, so the strings stay verbatim — five
     of the six source strings are already caps, but Home's is "Metropolitan
     Zoo". */
  .hero-eyebrow {
    font-family:'Roboto Mono',ui-monospace,monospace;
    font-weight:350; font-size:clamp(12px, .6765rem + .3676vw, 14px);
    line-height:16px; letter-spacing:.12em; text-transform:uppercase;
    text-wrap:pretty; max-width:54rem;
  }

  /* H1 on Home + the five top-level sections — live's
     `:is(.rvt-hero--feature,.rvt-hero--statement) .rvt-hero__title`. Matches
     Figma's T4 at desktop (54/56, wght 825, slnt -10); the fluid pair and
     `opsz: auto` are the live corrections. */
  .hero-title-display {
    font-weight:825; font-stretch:normal;
    font-size:clamp(36px, 1.5882rem + 3.3088vw, 54px);
    line-height:clamp(40px, 1.9118rem + 2.9412vw, 56px);
    font-variation-settings:'slnt' -10;
    text-transform:uppercase; text-wrap:balance;
  }

  /* H1 on the 210 deeper pages — live's base `.rvt-hero__title`, upright and
     sentence case. RECONCILED: Figma's T5 is wght 700 at wdth 100; the live
     site uses wght 750 at `font-stretch: semi-condensed` (= wdth 87.5), which
     is visibly narrower — 615.6px of ink for "Uncover the wonder of Africa"
     against T5's 643.9px at 48px. Live wins.
     NOT MATCHED: live also carries `"YTAS" 720, "YTLC" 530`. Those axes do not
     exist in the font this prototype loads — Google Fonts serves an axis-subset
     Roboto Flex for the requested `opsz,slnt,wdth,wght`, and setting YTAS/YTLC
     against it is provably inert (identical ink width with the axes at their
     extremes). Matching them would mean widening the global font request, which
     would re-serve the font the navigation renders in, so it is left alone. */
  .hero-title {
    font-weight:750; font-stretch:87.5%;
    font-size:clamp(29px, 1.114rem + 3.4926vw, 48px);
    line-height:clamp(32px, 1.2647rem + 3.6765vw, 52px);
    text-wrap:balance;
  }

  /* Interior lede — live `.rvt-hero__teaser`. RECONCILED: Figma's T10 is
     wdth 110; live is `font-stretch: semi-expanded` (= 112.5%). Live wins. */
  .hero-lede {
    font-weight:350; font-stretch:112.5%;
    font-size:clamp(16px, .9265rem + .3676vw, 18px);
    line-height:clamp(24px, 1.3529rem + .7353vw, 28px);
    text-wrap:pretty; max-width:54rem;
  }

  /* Home lede — live's `:is(.rvt-hero--statement) .rvt-hero__teaser`, one step
     up the scale (18→20 rather than 16→18). Figma's T9 pinned 20px at every
     width; live drops to 18px on mobile. */
  .hero-lede-lg {
    font-weight:350; font-stretch:112.5%;
    font-size:clamp(18px, 1.0515rem + .3676vw, 20px);
    line-height:clamp(24px, 1.3529rem + .7353vw, 28px);
    text-wrap:pretty; max-width:54rem;
  }

  /* =========================================================================
     STRUCTURAL CUSTOM ELEMENTS
     The source site wraps its landmarks in unstyled custom elements
     (content-ia.md, "Custom elements used"). They are reproduced so the DOM
     shape matches the real site; they carry no styling of their own.
     ========================================================================= */
  rvt-body, rvt-header, rvt-main, rvt-breadcrumbs,
  rvt-prototype-header-menu, rvt-prototype-search, rvt-prototype-nav { display:block; }

  /* Figma 1436:242656 — "Search the site", body extra-small / #343C42. */
  #site-search::placeholder { color:#343C42; opacity:1; }

  /* Skip link: visually hidden until focused. The source ships
     `a.rvt-skip-link` as the first focusable element; keep that. */
  .rvt-skip-link { position:fixed; top:0; left:0; z-index:60; transform:translateY(-110%);
                   transition:transform 150ms ease-out; }
  .rvt-skip-link:focus { transform:translateY(0); }

  /* No focus-ring style appears anywhere in the Figma file (spec 13.3), so the
     browser default is kept and merely offset for legibility on the crimson and
     ink surfaces. This is the one visual affordance not derived from the design. */
  :focus-visible { outline:2px solid currentColor; outline-offset:2px; }

  /* =========================================================================
     NAV CHROME BUTTONS — 40px tall, borders inside the box
     -------------------------------------------------------------------------
     In-scope: masthead Search (and mobile Menu), header CTAs, drawer close,
     drawer Volunteer / Become a member. Forked from the T-scale and from
     content CTAs so a 40px height cannot leak into the hero or sidenav.

     RECONCILED: Figma's masthead desktop button is 48px (spec 5) and the
     drawer CTAs are 48px (spec 7). Both are 40px here. `border-box` keeps
     the 1px outline inside that 40px (otherwise the outlined pair grows
     to 42). Drawer CTAs keep 40px left/right padding (24px when paired
     at sm) so the inset reads equal to the height, not Rivet's 12–16px
     default. Menu & Search at lg uses 8px L/R instead — the visual
     top/bottom inset of the 24px T14 line box inside the 40px button.

     The earlier 26px mobile-CTA collapse was `flex-1` (`flex-basis: 0%`)
     on a column flex item: height lost to the main axis and the <a>
     shrank to the T14 line box plus borders. Explicit height + min-height
     + flex-shrink:0 on `.nav-btn`, and `w-full` instead of `flex-1` below
     sm, is what actually keeps the <a>s at 40px.

     Close is a locked 40×40 square at every breakpoint — no lg: size bump.
     ========================================================================= */
  .nav-btn {
    box-sizing: border-box;
    display: flex;
    align-items: center;
    height: 40px;
    min-height: 40px;
    flex-shrink: 0;
  }
  /* Side-by-side from sm (640). Two 40px-padded buttons cannot hold
     "Volunteer at the zoo" + an 8px gap + a 16px arrow on one line
     (need ~259px each; half the 533px desktop row is 236.5px). 24px is
     the maximum equal L/R padding that still leaves a readable gap
     before the arrow; stacked below sm keeps the full 40. */
  .nav-btn-cta {
    padding-left: 40px;
    padding-right: 40px;
    gap: 8px;
  }
  @media screen(sm) {
    .nav-btn-cta { padding-left: 24px; padding-right: 24px; }
  }
  .nav-btn-close {
    width: 40px;
    min-width: 40px;
    padding: 0;
    justify-content: center;
  }
  /* Search panel close — Rivet `.rvt-button--medium.rvt-button--icon-only`
     (32×32) so it matches header Search. Menu drawer close stays 40×40. */
  #search-drawer-close.nav-btn-close {
    width: 32px;
    min-width: 32px;
    height: 32px;
    min-height: 32px;
  }
  /* Icon-only 62×40 below lg (spec 12.5); labelled at lg with L/R padding
     matching the visual T/B inset (8px = (40 − 24px T14 line box) / 2). */
  .nav-btn-menu {
    width: 62px;
    justify-content: center;
    padding: 0;
  }
  @media screen(lg) {
    .nav-btn-menu {
      width: auto;
      justify-content: flex-start;
      padding-left: 16px;
      padding-right: 16px;
      gap: 8px;
    }
  }
  /* Composite glyph is 35×18 of ink. The previous 38×24 slot letterboxed it
     inside a taller box; hugging the ink and lifting 2px optically centres
     it in the 40px button (hamburger rules begin at y=4 of the 18px
     viewBox, so geometric centre reads low next to the T14 cap-height). */
  .nav-btn-menu-icon {
    display: block;
    width: 35px;
    height: 18px;
    flex-shrink: 0;
    transform: translateY(-2px);
  }

  /* =========================================================================
     RIVET BUTTON HOVER / FOCUS
     -------------------------------------------------------------------------
     Interaction tokens only. Heights, padding, and width from the chrome
     block above stay as signed off (Menu & Search 40 / 16px L/R; close
     40×40; drawer CTAs 40).

     Source of truth: computed styles on the official v3 button docs
     (button-form + sibling button-cta), headless Chrome hover on each
     variant, cross-checked against rivet.css
     (`https://indiana-university.github.io/rivet-source/@rivet-iu/core/dist/rivet.css`).

     Rivet `.rvt-button:hover` / `a:visited:hover` sets background-color,
     border-color, color. Base `.rvt-button` sets `text-decoration: none`
     (no underline-on-hover). There is no `:active` rule — pressed is
     `aria-pressed` only — so `:active` below repeats `:hover` (CSS, not JS).

     Focus is Rivet's global `:focus-visible` (2px solid accent-strong
     `#6D0808`, offset 2px, `isolation: isolate`), scoped to these
     controls. The page-wide `currentColor` ring is invisible on the
     white-label Menu button.

     RECONCILED: Rivet 2 names (`--secondary`, `--danger`) are gone in v3.
     Analogues are Strong / Normal (default outline) / CTA.
     ========================================================================= */

  /* Search Go — Rivet header search submit (`.rvt-button--strong:hover`).
     Masthead Menu / Search icon buttons are `.masthead-tool`, not Strong;
     their hover is with the header rules below. */
  .nav-btn-menu:hover,
  .nav-btn-menu:active,
  .nav-btn-go:hover,
  .nav-btn-go:active {
    background-color: #000;
    color: #fff;
    border-color: #000;
    text-decoration: none;
    box-shadow: none;
  }

  /* Back — drawer keeps the outlined Rivet control (32/12 via `h-8 px-3`).
     Sidenav Back is a text link (24px / 12px type, no box). `border-box`
     keeps the drawer 1px outline inside its 32px box. */
  .nav-btn-back {
    box-sizing: border-box;
  }
  /* Shrink-wrap in the sidenav. No outline — padding is 0 so the arrow
     lines up with title/item text. Height stays 24px so crumb math
     (`has-sidenav-back` +24) is unchanged. Drawer stays `inline-flex`. */
  #sidenav .nav-btn-back {
    display: flex;
    width: max-content;
    border: 0;
    padding-inline: 0;
  }

  /* Close X + drawer Back — Rivet default `.rvt-button:hover` (Normal /
     outline). Fill stays transparent; text + border → inverse-strong `#000`. */
  .nav-btn-close:hover,
  .nav-btn-close:active,
  .nav-btn-back:hover,
  .nav-btn-back:active {
    background-color: transparent;
    color: #000;
    border-color: #000;
    text-decoration: none;
    box-shadow: none;
  }

  /* Sidenav Back — text-link hover (underline), not the outlined button. */
  #sidenav .nav-btn-back:hover,
  #sidenav .nav-btn-back:active {
    background-color: transparent;
    color: inherit;
    border-color: transparent;
    text-decoration: underline;
    box-shadow: none;
  }

  /* Drawer Volunteer / Become a member — Rivet `.rvt-button--cta:hover`
     (outline accent). Fill stays transparent; text + border →
     accent-strong `#6D0808`. No underline. */
  .nav-btn-cta:hover,
  .nav-btn-cta:active {
    background-color: transparent;
    color: #6D0808;
    border-color: #6D0808;

, and field teams bring us knowledge we can't get from captive animals."]},"private-events-rentals":{"t":"Private Events & Rentals - Indiana Zooniversity","l":"Private Events & Rentals","v":2,"p":"events-activities","c":["weddings","corporate-meetings","picnics-reunions"],"h":"Host your event here","d":"Six rentable venues from an intimate garden to a {300}-guest hall, all with animal views and all available after public hours.","s":"What every rental includes","b":["Exclusive use of the space, tables and chairs, on-site event staff, and after-hours zoo access for your guests. Catering is through our exclusive in-house partner."]},"getting-here":{"t":"Getting Here - Indiana Zooniversity","l":"Getting Here","v":2,"p":"plan-your-visit","c":["directions-address","parking","transit-bike-rideshare"],"h":"Finding us and getting in","d":"The zoo sits fifteen minutes from downtown with its own highway exit. Parking, transit, and rideshare all arrive at different gates.","s":"Pick your gate before you leave","b":["Cars and rideshare use the main west entrance. Buses, school groups, and accessible parking use the east entrance. Bike and transit riders arrive at the north path."]},"zoo-rules-policies":{"t":"Zoo Rules & Policies - Indiana Zooniversity","l":"Zoo Rules & Policies","v":2,"p":"plan-your-visit","c":["bags-prohibited-items","weather-closures"],"h":"House rules","d":"A short list of policies that keep animals safe and visits pleasant. Staff are happy to answer questions about any of them.","s":"The rules that matter most","b":["Don't feed the animals, stay behind barriers, keep voices low near habitats, and supervise children at all times. Everything else is detail."]},"volunteer":{"t":"Volunteer - Indiana Zooniversity","l":"Volunteer","v":2,"p":"support-the-zoo","c":["adult-volunteer-program","internships"],"h":"Give your time","d":"Six hundred and eighty volunteers cover interpretation, horticulture, education, and animal care support. Most started knowing nothing about zoos.","s":"What volunteers actually do","b":["Interpretation is the largest role — standing at habitats and talking with visitors. Others work in horticulture, support education programs, or assist keepers with prep work."]},"play-discovery-zones":{"t":"Play & Discovery Zones - Indiana Zooniversity","l":"Play & Discovery Zones","v":2,"p":"kids-schools","c":["discovery-playground","childrens-barnyard"],"h":"Places built for running around","d":"Two dedicated play areas where the rule is the opposite of the rest of the zoo — touch things, climb things, be loud.","s":"Where they are","b":["Both zones sit on the west loop near the plaza, within sight of shaded seating and restrooms. Adults must remain in the zone with children under {8}."]},"event-calendar":{"t":"Event Calendar - Indiana Zooniversity","l":"Event Calendar","v":2,"p":"events-activities","h":"Everything, by date","d":"A single calendar covering daily programs, seasonal events, adults-only nights, and member previews for the next twelve months.","s":"Filtering the calendar","b":["Filter by event type, age range, or whether a ticket is required. Member-only dates appear only when you're signed in to a member account."]},"hours-admission":{"t":"Hours & Admission - Indiana Zooniversity","l":"Hours & Admission","v":2,"p":"plan-your-visit","c":["daily-seasonal-hours","tickets-pricing"],"h":"When we're open and what it costs","d":"Hours shift with the seasons and the daylight. Check the current calendar before you travel, especially around holidays and severe weather.","s":"Two things to check before you leave","b":["Confirm today's closing time and whether any habitats are on a reduced schedule. Last admission is always one hour before the gates close."]},"animals-az":{"t":"Animals A–Z - Indiana Zooniversity","l":"Animals A–Z","v":2,"p":"animals-habitats","h":"Every species, alphabetically","d":"A complete index of the {312} species living at the zoo, with the habitat each one calls home and whether it's currently on view.","s":"Using the index","b":["Filter by region, class, or conservation status. Entries marked \"off view\" are behind the scenes for medical care, breeding, or seasonal housing."]},"corporate-partnership":{"t":"Corporate Partnership - Indiana Zooniversity","l":"Corporate Partnership","v":2,"p":"support-the-zoo","c":["sponsorship-opportunities","matching-gifts"],"h":"Partner with the zoo","d":"Sponsorship, habitat naming, employee engagement, and matching gift programs for businesses that want visible community presence.","s":"What partnership looks like","b":["Partnerships range from a single event sponsorship to multi-year habitat naming. All include recognition on site, in the annual report, and across event materials."]},"daily-activities":{"t":"Daily Activities - Indiana Zooniversity","l":"Daily Activities","v":2,"p":"events-activities","c":["todays-schedule","keeper-talks","feeding-demonstrations"],"h":"What's happening today","d":"Between fifteen and twenty programs run every day, all free with admission and none requiring a reservation. Times shift slightly with weather and animal behavior.","s":"How to catch them","b":["Programs cluster between {10:00 AM} and {3:00 PM}. Arrive five minutes early for the popular ones — the lion feeding and giraffe deck both draw standing crowds."]},"south-america":{"t":"South America - Indiana Zooniversity","l":"South America","v":2,"p":"animals-habitats","c":["amazon-flooded-forest","andes-highlands","tropical-aviary"],"h":"Flooded forest to mountain air","d":"From the Amazon's seasonally flooded understory to the thin air of the high Andes, this region covers the widest elevation range at the zoo.","s":"Following the water","b":["The Amazon habitat floods and drains on a managed cycle, changing which parts of the forest floor are accessible. Species here are adapted to a landscape that reorganizes itself every year."]},"dining-shopping":{"t":"Dining & Shopping - Indiana Zooniversity","l":"Dining & Shopping","v":2,"p":"plan-your-visit","c":["restaurants-cafes","gift-shops"],"h":"Eat, drink, and take something home","d":"Four dining locations and three shops sit along the main loop, so you're never more than a few minutes from food or a restroom.","s":"Where to eat and when","b":["The plaza restaurants are busiest between noon and 1:30 p.m. Snack carts along the savanna loop stay open all day and take the same payment methods."]},"animal-encounters":{"t":"Animal Encounters - Indiana Zooniversity","l":"Animal Encounters","v":2,"p":"events-activities","c":["giraffe-feeding","behind-the-scenes-tours","private-vip-experiences"],"h":"Get closer than the rail","d":"Ticketed experiences that put you inside or immediately beside a habitat with a keeper. Group sizes are small and most sell out in advance.","s":"How encounters differ from tours","b":["An encounter is built around contact with a specific animal. A tour is built around a place and the work that happens in it. Both are small-group and keeper-led."]},"maps-guides":{"t":"Maps & Guides - Indiana Zooniversity","l":"Maps & Guides","v":2,"p":"plan-your-visit","c":["interactive-zoo-map","suggested-routes"],"h":"Find your way around","d":"The zoo is a single loop with four spurs, so it's hard to get truly lost — but knowing where the shortcuts are saves a lot of walking.","s":"Reading the pathway signs","b":["Every junction has a numbered marker matching the printed map. Color bands on the signposts indicate which region you're standing in."]},"australia-islands":{"t":"Australia & Islands - Indiana Zooniversity","l":"Australia & Islands","v":2,"p":"animals-habitats","c":["outback-walkabout","lorikeet-landing"],"h":"Marsupials, monitors, and island birds","d":"Australia's outback and the forested islands to its north, covering species found nowhere else on earth. Home to two of our three walk-through habitats.","s":"Why island species are different","b":["Long isolation produces evolutionary outliers — pouched mammals, giant lizards, nectar-feeding parrots. It also makes these species unusually vulnerable to introduced predators."]},"field-trips":{"t":"Field Trips - Indiana Zooniversity","l":"Field Trips","v":2,"p":"kids-schools","c":["plan-a-field-trip","guided-programs-by-grade","self-guided-visits"],"h":"Bring your class to the zoo","d":"Guided and self-guided options for every grade, with discounted admission, reserved arrival windows, and a separate entrance that keeps groups out of the general queue.","s":"Guided or self-guided","b":["Guided programs include a {60}-minute educator-led session; self-guided trips get the same discounted rate and a printed activity packet but no staff instruction."]},"teen-programs":{"t":"Teen Programs - Indiana Zooniversity","l":"Teen Programs","v":2,"p":"kids-schools","c":["teen-volunteer-corps","zoo-career-exploration"],"h":"For teens who want more than a visit","d":"Volunteer roles, career exploration, and paid summer positions for students who are seriously interested in animal care and conservation work.","s":"Where teen programs lead","b":["Many of our current keepers started as teen volunteers here. The program is structured as a genuine pipeline, not a résumé line."]},"animal-care-habitat-design":{"t":"Animal Care & Habitat Design - Indiana Zooniversity","l":"Animal Care & Habitat Design","v":2,"p":"animals-habitats","c":["nutrition-commissary","veterinary-hospital","enrichment-training"],"h":"The work behind the glass","d":"Sixty-two people care for the animals here — keepers, veterinarians, nutritionists, and horticulturists. Most of their work happens before the gates open.","s":"A day that starts at 6 a.m.","b":["Health checks, diet prep, habitat cleaning, and enrichment placement all happen before the first visitor arrives. What you see during the day is the second half of the shift."]},"africa":{"t":"Africa - Indiana Zooniversity","l":"Africa","v":2,"p":"animals-habitats","c":["grasslands-plains","rainforests-woods","deserts-dry-lands"],"h":"Uncover the wonder of Africa","d":"Step into the heart of the savanna. From the mighty roar of our lion pride to the lush canopy of the rainforest, your ultimate wildlife adventure begins here.","s":"Where epic landscapes come alive","b":["Spanning vast open plains, dense tropical forests, and sun-drenched sands, our Africa region brings you face-to-face with Earth's most majestic creatures. Explore immersive, naturalistic habitats designed to inspire wonder, foster discovery, and protect wild species for generations to come."]},"annual-report-financials":{"t":"Annual Report & Financials - Indiana Zooniversity","l":"Annual Report & Financials","v":2,"p":"support-the-zoo","h":"Open books","d":"Annual reports, audited financial statements, and IRS Form 990 filings going back {10} years, published in full.","s":"What's published","b":["The annual report covers attendance, animal population changes, conservation spending, and donor recognition. Audited statements and Form 990s are posted alongside it each spring."]},"arctic-oceans":{"t":"Arctic & Oceans - Indiana Zooniversity","l":"Arctic & Oceans","v":2,"p":"animals-habitats","c":["polar-shores","penguin-coast","tide-pools-touch-tank"],"h":"Cold water and colder coasts","d":"Our largest indoor complex, combining a polar shoreline, a penguin colony, and eleven aquarium galleries under one roof with underwater viewing throughout.","s":"Seeing from below the waterline","b":["Almost every habitat in this region has an underwater window, because these animals do their most interesting work below the surface. The polar pool and penguin colony both offer full-depth viewing."]},"camps-classes":{"t":"Camps & Classes - Indiana Zooniversity","l":"Camps & Classes","v":2,"p":"kids-schools","c":["summer-camp","school-break-camps"],"h":"Days that belong to the kids","d":"Week-long summer camps, single-day break camps, and family workshops — all with behind-the-scenes access that regular admission doesn't include.","s":"What makes camp different","b":["Campers go places visitors don't: the commissary, the vet hospital, the back side of the savanna barn. Groups stay under {16} so every camper gets hands-on time."]},"membership":{"t":"Membership - Indiana Zooniversity","l":"Membership","v":2,"p":"support-the-zoo","c":["membership-levels","join-or-renew","member-benefits"],"h":"Unlimited visits, all year","d":"Membership covers admission for a full year, opens the gates thirty minutes early, and discounts nearly everything inside. Two visits and it's paid for.","s":"Why members come back","b":["The real benefit isn't the discount — it's that a {45}-minute visit stops feeling like a waste. Members drop in for one habitat and leave, which is how the zoo is best used."]},"classroom-resources":{"t":"Classroom Resources - Indiana Zooniversity","l":"Classroom Resources","v":2,"p":"kids-schools","c":["lesson-plans","virtual-field-trips"],"h":"Free materials for your classroom","d":"Standards-aligned lesson plans, printable activities, and recorded habitat tours — all free, all downloadable, all usable whether or not you ever visit.","s":"No visit required","b":["Every resource here is designed to stand alone. Schools that can't travel use them as a full unit; schools that can use them as pre-visit and post-visit anchors."]},"seasonal-events":{"t":"Seasonal Events - Indiana Zooniversity","l":"Seasonal Events","v":2,"p":"events-activities","c":["spring-baby-animal-days","summer-zoo-nights-concert-series","fall-boo-at-the-zoo","winter-wild-lights"],"h":"Four events, four transformations","d":"Each season brings a signature event that changes how the zoo looks, sounds, and runs. Three are included with admission; one is separately ticketed.","s":"What's included and what isn't","b":["Baby Animal Days and Boo at the Zoo are included with admission. Zoo Nights requires evening admission. Wild Lights is a separate timed-entry ticket."]},"asia":{"t":"Asia - Indiana Zooniversity","l":"Asia","v":2,"p":"animals-habitats","c":["bamboo-forest","tiger-ridge","asian-wetlands"],"h":"Forests, ridges, and river valleys","d":"Asia's habitats span dense bamboo, temperate mountain forest, and warm wetland. It is the coolest, shadiest walk in the zoo on a hot day.","s":"Three climates in one region","b":["The Asia loop moves from humid bamboo through temperate ridge forest and down into wetland. Species are grouped by climate rather than country, which is why the tigers and pandas sit so close together."]},"donate":{"t":"Donate - Indiana Zooniversity","l":"Donate","v":2,"p":"support-the-zoo","c":["make-a-gift","adopt-an-animal","tribute-memorial-gifts","planned-giving"],"h":"Give directly","d":"One-time gifts, monthly giving, animal adoptions, tribute gifts, and planned giving. Every dollar stays with animal care and conservation.","s":"Where donations go","b":["Unrestricted gifts fund whatever needs it most, usually veterinary care and habitat maintenance. Restricted gifts can be directed to a specific species or field project."]},"directions-address":{"t":"Directions & Address - Indiana Zooniversity","l":"Directions & Address","v":3,"p":"getting-here","h":"Address and driving routes","d":"We're at {1200 Wildlife Parkway}, off Exit {14}. Follow the brown wildlife signs from the exit ramp — GPS occasionally routes to the service entrance.","s":"Coming from each direction","b":["From the north and east, take Exit {14} and turn right at the second light. From the south and west, take Exit {13} and follow Wildlife Parkway for two miles."]},"adopt-an-animal":{"t":"Adopt an Animal - Indiana Zooniversity","l":"Adopt an Animal","v":3,"p":"donate","c":["adoption-packages","adoptable-species"],"h":"Sponsor an individual animal","d":"Symbolic adoption funds the actual care of one animal for a year — its diet, enrichment, and veterinary costs — and comes with a package about that specific animal.","s":"What \"symbolic\" means","b":["You're not taking the animal home. Your gift is directed to that animal's care budget, and you receive updates about it through the year."]},"enrichment-training":{"t":"Enrichment & Training - Indiana Zooniversity","l":"Enrichment & Training","v":3,"p":"animal-care-habitat-design","h":"Giving animals something to do","d":"Every animal receives daily enrichment designed for its species — puzzle feeders, scent trails, novel objects, and training sessions that double as medical care.","s":"Enrichment is not decoration","b":["Each item is chosen to trigger a specific natural behavior — foraging, digging, shredding, hunting. Keepers log what gets used and what gets ignored, and the plan changes weekly based on that record."]},"teen-volunteer-corps":{"t":"Teen Volunteer Corps - Indiana Zooniversity","l":"Teen Volunteer Corps","v":3,"p":"teen-programs","c":["apply-to-volunteer"],"h":"Work the floor alongside staff","d":"Teens ages 14 to 18 commit to one shift a week for a full season, running interpretive carts, assisting educators, and supporting keeper tasks.","s":"The commitment","b":["One four-hour shift weekly for a minimum of one season, plus an initial training day. Volunteers who complete two seasons become eligible for paid summer roles."]},"party-packages":{"t":"Party Packages - Indiana Zooniversity","l":"Party Packages","v":3,"p":"birthday-parties","c":["keeper-for-a-day-package"],"h":"Two ways to celebrate","d":"A standard package built around an animal visit, and a premium package that takes the birthday child behind the scenes. Both run two hours.","s":"Comparing the two","b":["The Wild Explorer package brings an animal to your party room. The Keeper for a Day package takes the birthday child into a back-of-house area with a keeper while guests do a themed activity."]},"planned-giving":{"t":"Planned Giving - Indiana Zooniversity","l":"Planned Giving","v":3,"p":"donate","h":"Include the zoo in your estate","d":"Bequests, charitable trusts, and beneficiary designations that support animal care beyond your lifetime, with no cost during it.","s":"The most common approaches","b":["A bequest in a will, naming the zoo as a retirement account beneficiary, or a charitable remainder trust. Our advancement team works alongside your own attorney or advisor."]},"sensory-friendly-visits":{"t":"Sensory-Friendly Visits - Indiana Zooniversity","l":"Sensory-Friendly Visits","v":3,"p":"accessibility","h":"Quieter ways to visit","d":"Free sensory kits, a printed guide rating each habitat for noise and crowding, and two dedicated quiet rooms are available every day.","s":"What's in a sensory kit","b":["Noise-reducing headphones, a fidget set, a visual schedule card, and a laminated map marking the two quiet rooms and the least-crowded routes."]},"andes-highlands":{"t":"Andes Highlands - Indiana Zooniversity","l":"Andes Highlands","v":3,"p":"south-america","h":"Thin air and hard ground","d":"A rocky highland habitat for Andean bears, alpaca, and highland birds, built on the steepest terrain on the zoo campus.","s":"South America's only bear","b":["Andean bears — the spectacled bear — are the continent's only bear species and among the most arboreal. Ours build daytime nests in the habitat's mature trees."]},"tide-pools-touch-tank":{"t":"Tide Pools & Touch Tank - Indiana Zooniversity","l":"Tide Pools & Touch Tank","v":3,"p":"arctic-oceans","h":"Put your hands in the water","d":"A shallow open tank of sea stars, urchins, anemones, and hermit crabs, staffed continuously so you always have someone to ask.","s":"How to touch","b":["Two fingers, gentle, always from the top — never lift an animal out of the water. Handwashing stations sit at both the entrance and exit and are required in both directions."]},"picnics-reunions":{"t":"Picnics & Reunions - Indiana Zooniversity","l":"Picnics & Reunions","v":3,"p":"private-events-rentals","h":"Casual gatherings on the lawn","d":"Reserved picnic pavilions on the west lawn for family reunions, company picnics, and community groups from {25} to {250} guests.","s":"How pavilion rental works","b":["Pavilions are reserved in four-hour blocks and include tables, admission for your group, and access to the adjacent playground. Outside food is welcome; grills are not permitted."]},"spring-baby-animal-days":{"t":"Spring: Baby Animal Days - Indiana Zooniversity","l":"Spring: Baby Animal Days","v":3,"p":"seasonal-events","h":"Everything is new in April","d":"Spring births across the zoo, with a public naming vote, extended nursery viewing, and keeper talks focused on each new arrival.","s":"What to expect","b":["Most births happen between March and May. The nursery viewing window opens daily and a running list of new arrivals is posted at the entrance and updated each morning."]},"bags-prohibited-items":{"t":"Bags & Prohibited Items - Indiana Zooniversity","l":"Bags & Prohibited Items","v":3,"p":"zoo-rules-policies","h":"What you can and can't bring","d":"All bags are visually inspected at the gate. Outside food and drink are welcome; a short list of items is not.","s":"Not permitted","b":["Balloons, straws, glass containers, alcohol, drones, and any weapon. Balloons and straws are excluded because animals ingest them if they blow into habitats."]},"veterinary-hospital":{"t":"Veterinary Hospital - Indiana Zooniversity","l":"Veterinary Hospital","v":3,"p":"animal-care-habitat-design","h":"A full hospital on site","d":"Our animal hospital has surgery, radiology, a laboratory, and quarantine housing, staffed by three veterinarians and five technicians year-round.","s":"Preventive care first","b":["Most of the hospital's work is routine — annual exams, dental care, and bloodwork. Training animals to participate voluntarily means far fewer procedures require anesthesia."]},"make-a-gift":{"t":"Make a Gift - Indiana Zooniversity","l":"Make a Gift","v":3,"p":"donate","h":"One-time donation","d":"Give any amount, directed to general animal care or to a specific program. Gifts are tax-deductible and receipts are issued immediately.","s":"Where you can direct a gift","b":["General animal care, the veterinary fund, a named field conservation project, or the school access fund that covers field trips for Title I schools."]},"adult-volunteer-program":{"t":"Adult Volunteer Program - Indiana Zooniversity","l":"Adult Volunteer Program","v":3,"p":"volunteer","c":["volunteer-roles","apply-to-volunteer"],"h":"A real commitment, seriously supported","d":"Adult volunteers commit to one weekly shift for a full year and receive {40} hours of training before their first solo shift.","s":"The commitment","b":["One four-hour shift weekly for twelve months, plus initial training and four continuing-education sessions a year. Volunteers receive a membership and full staff discounts."]},"summer-zoo-nights-concert-series":{"t":"Summer: Zoo Nights Concert Series - Indiana Zooniversity","l":"Summer: Zoo Nights Concert Series","v":3,"p":"seasonal-events","c":["concert-lineup","food-drink-at-zoo-nights"],"h":"Live music, open late","d":"Every Friday from {June} through {August}, the plaza hosts live music until {9:00 PM} while the savanna loop and aquarium stay open.","s":"How the night runs","b":["Gates for evening admission open at {5:00 PM}, music starts at {6:30}, and the last set ends at {8:45}. Habitats close progressively from {8:00} onward."]},"corporate-meetings":{"t":"Corporate Meetings - Indiana Zooniversity","l":"Corporate Meetings","v":3,"p":"private-events-rentals","h":"Meetings people show up to","d":"Four meeting spaces from a {20}-person boardroom to a {300}-seat hall, with AV, catering, and optional animal visits during breaks.","s":"What's available","b":["Full AV, wired and wireless connectivity, in-house catering, and the option to add a keeper visit or behind-the-scenes tour as a break activity."]},"nutrition-commissary":{"t":"Nutrition & Commissary - Indiana Zooniversity","l":"Nutrition & Commissary","v":3,"p":"animal-care-habitat-design","c":["diet-preparation"],"h":"{4,000} pounds of food a week","d":"Every animal eats a diet formulated for its species, age, and health status, prepared fresh daily in an on-site commissary kitchen.","s":"No two diets are the same","b":["A single day's prep covers browse for the giraffe, live fish for the otters, formulated biscuits for the primates, and hand-mixed nectar for the lorikeets — all weighed to the gram."]},"weddings":{"t":"Weddings - Indiana Zooniversity","l":"Weddings","v":3,"p":"private-events-rentals","c":["ceremony-venues","wedding-packages-pricing"],"h":"Say it with an audience","d":"Ceremony and reception spaces for {40} to {300} guests, all with habitat views, and a dedicated coordinator from booking through the day itself.","s":"How a zoo wedding works","b":["Ceremonies begin after the zoo closes to the public, so your guests have the grounds to themselves. Most couples pair an outdoor ceremony with an indoor reception."]},"brew-at-the-zoo":{"t":"Brew at the Zoo - Indiana Zooniversity","l":"Brew at the Zoo","v":3,"p":"adults-only-events","h":"{40} breweries, one evening","d":"A late-summer tasting event with regional breweries set up along the main loop, plus food trucks and after-hours access to the savanna and aquarium.","s":"What the ticket covers","b":["Unlimited {2}-ounce tastings from all participating breweries, a commemorative glass, and zoo access until {10:00 PM}. Designated driver tickets are available at a reduced rate."]},"self-guided-visits":{"t":"Self-Guided Visits - Indiana Zooniversity","l":"Self-Guided Visits","v":3,"p":"field-trips","h":"Bring your own plan","d":"Self-guided groups get the discounted rate, reserved arrival window, and a grade-appropriate activity packet, but no educator-led session.","s":"What's included","b":["A printed scavenger hunt keyed to your grade band, a route suggestion sized to your available time, and reserved lunch space on the west lawn."]},"virtual-field-trips":{"t":"Virtual Field Trips - Indiana Zooniversity","l":"Virtual Field Trips","v":3,"p":"classroom-resources","h":"A keeper in your classroom","d":"Live {30}-minute video sessions with a keeper and an ambassador animal, including student Q&A. Free, and available to any classroom anywhere.","s":"How a session runs","b":["Ten minutes of habitat walkthrough, ten with a live animal, ten of student questions. Sessions are booked in the same system as in-person field trips."]},"weather-closures":{"t":"Weather & Closures - Indiana Zooniversity","l":"Weather & Closures","v":3,"p":"zoo-rules-policies","h":"Rain, heat, and lightning","d":"The zoo stays open in rain. Lightning within {10} miles closes outdoor habitats temporarily, and extreme heat moves some animals indoors.","s":"What closes and when","b":["Lightning triggers a 30-minute outdoor hold that resets with each strike. Heat above {95}°F moves cold-adapted species indoors. Full-day closures are announced by 7 a.m."]},"tickets-pricing":{"t":"Tickets & Pricing - Indiana Zooniversity","l":"Tickets & Pricing","v":3,"p":"hours-admission","c":["general-admission","group-tickets","discount-free-days"],"h":"Tickets, rates, and what's included","d":"One admission ticket covers every habitat, keeper talk, and daily demonstration. A handful of encounters and rides carry a separate fee.","s":"What admission includes","b":["All habitats, the aquarium, every scheduled keeper talk, and the discovery playground are included. Giraffe feeding, behind-the-scenes tours, and the carousel are ticketed separately."]},"membership-levels":{"t":"Membership Levels - Indiana Zooniversity","l":"Membership Levels","v":3,"p":"membership","c":["individual-dual","family-membership","keepers-circle"],"h":"Four levels, one card","d":"Levels differ by how many people they cover and how many guests you can bring. Every level includes unlimited admission and early entry.","s":"Picking a level","b":["Choose by household size first, then by how often you expect to bring guests. Levels can be upgraded mid-year for the difference in price."]},"private-vip-experiences":{"t":"Private VIP Experiences - Indiana Zooniversity","l":"Private VIP Experiences","v":3,"p":"animal-encounters","h":"Book the whole thing privately","d":"Any encounter or tour can be booked as a private experience for your group alone, with flexible timing and the option to combine multiple animals.","s":"How private booking works","b":["Minimum {4} guests, maximum {12}, booked at least {21} days ahead. Private sessions can be scheduled outside public hours for an additional fee."]},"field-conservation-projects":{"t":"Field Conservation Projects - Indiana Zooniversity","l":"Field Conservation Projects","v":3,"p":"our-conservation-work","c":["africa-projects","local-regional-projects"],"h":"Where the money goes","d":"Each project is a multi-year partnership with an organization already working in that landscape. We fund and staff; they lead.","s":"How we choose projects","b":["We fund projects for species we hold, in landscapes where local partners are already established, with measurable population outcomes. Partnerships run a minimum of five years."]},"rainforests-woods":{"t":"Rainforests & Woods - Indiana Zooniversity","l":"Rainforests & Woods","v":3,"p":"africa","c":["primates"],"h":"Under the canopy","d":"A humid, layered forest habitat with a raised walkway that puts you at mid-canopy height. Expect to hear the residents before you see them.","s":"Four layers, four sets of species","b":["The habitat is built in floor, understory, canopy, and emergent layers, each occupied by different species. The walkway crosses all four, so the animals you can see change with your elevation."]},"asian-wetlands":{"t":"Asian Wetlands - Indiana Zooniversity","l":"Asian Wetlands","v":3,"p":"asia","h":"Water, reeds, and wading birds","d":"A shallow-water habitat of reed beds and mudflats supporting cranes, storks, and waterfowl across a boardwalk that crosses the marsh.","s":"A habitat that changes by season","b":["Water levels are managed to mimic monsoon cycles, so the mudflats expand and contract through the year. Bird behavior shifts with it — nesting in the shallow season, feeding in the deep."]},"grasslands-plains":{"t":"Grasslands & Plains - Indiana Zooniversity","l":"Grasslands & Plains","v":3,"p":"africa","c":["big-mammals","hoofed-herds"],"h":"Life on the open savanna","d":"Twelve acres of rolling grassland shared by predators and grazers across sightlines that mirror the real thing. This is the largest single habitat at the zoo.","s":"A landscape built for distance","b":["Grassland species evolved to see and be seen across long distances, so the habitat is designed around open sightlines rather than barriers. Hidden moats and grade changes separate species without breaking the view."]},"service-animals":{"t":"Service Animals - Indiana Zooniversity","l":"Service Animals","v":3,"p":"accessibility","h":"Bringing a service animal","d":"Trained service animals are welcome throughout the zoo, with a small number of habitats where they can't safely enter. Relief areas are marked on the map.","s":"Where service animals can't go","b":["The walk-through aviary, the touch pool, and the children's barnyard exclude service animals for animal safety. Free kennel holding is available at guest services."]},"polar-shores":{"t":"Polar Shores - Indiana Zooniversity","l":"Polar Shores","v":3,"p":"arctic-oceans","c":["polar-bear"],"h":"A shoreline built for a {1,000}-pound swimmer","d":"A rocky arctic coast with a {170,000}-gallon saltwater pool chilled year-round. The pool is deep enough for full diving behavior.","s":"Why depth matters","b":["Polar bears are marine mammals that hunt by diving and surfacing. A shallow pool produces pacing; a deep one produces swimming, diving, and object play — which is what you'll see here."]},"restaurants-cafes":{"t":"Restaurants & Cafés - Indiana Zooniversity","l":"Restaurants & Cafés","v":3,"p":"dining-shopping","h":"Sit-down and grab-and-go","d":"Two full restaurants, a coffee café, and seasonal snack carts. Outside food is welcome too, and picnic tables are available near the west lawn.","s":"The main locations","b":["Savanna Grill serves burgers and salads with indoor seating. Rainforest Café does bowls, wraps, and coffee. Both offer vegetarian, vegan, and gluten-free options."]},"summer-camp":{"t":"Summer Camp - Indiana Zooniversity","l":"Summer Camp","v":3,"p":"camps-classes","c":["camp-sessions-ages","camp-registration"],"h":"A week inside the zoo","d":"Nine week-long sessions running June through August for ages 5 to 13, grouped by age band with age-appropriate access and activities.","s":"A typical camp day","b":["Morning habitat visit, mid-morning animal encounter, lunch, an afternoon project, and a closing circle. Campers are outdoors most of the day and indoors during peak heat."]},"sustainability-at-the-zoo":{"t":"Sustainability at the Zoo - Indiana Zooniversity","l":"Sustainability at the Zoo","v":3,"p":"our-conservation-work","h":"Our own footprint","d":"Solar generation, a closed-loop water system in the aquarium, composting of all animal waste, and a hard elimination of single-use plastics across the grounds.","s":"What we've changed","b":["{40%} of electricity from on-site solar, {100%} of animal waste composted and reused in habitat plantings, and no single-use plastic sold anywhere on the property since {2022}."]},"daily-seasonal-hours":{"t":"Daily & Seasonal Hours - Indiana Zooniversity","l":"Daily & Seasonal Hours","v":3,"p":"hours-admission","c":["summer-hours","winter-hours"],"h":"Hours change four times a year","d":"The zoo runs on four seasonal schedules built around daylight and animal comfort. Summer runs longest; winter runs shortest.","s":"How the seasonal calendar works","b":["Each schedule takes effect on a fixed date rather than a holiday weekend, so the calendar stays predictable year to year. Grounds close 60 minutes after the posted last admission."]},"tribute-memorial-gifts":{"t":"Tribute & Memorial Gifts - Indiana Zooniversity","l":"Tribute & Memorial Gifts","v":3,"p":"donate","h":"Give in someone's name","d":"Honor or memorial gifts with a notification card sent to the person or family you designate. Amounts are never disclosed.","s":"How notification works","b":["You provide the recipient's name and address and an optional message; we send a card noting that a gift was made in their honor. The amount is never included."]},"deserts-dry-lands":{"t":"Deserts & Dry Lands - Indiana Zooniversity","l":"Deserts & Dry Lands","v":3,"p":"africa","c":["meerkat-mob"],"h":"Life in the heat","d":"An arid habitat of sand, rock, and hardy scrub built around species that manage water rather than avoid it. Warmest part of the zoo year-round.","s":"Designed around shade","b":["Desert animals spend most of the day out of direct sun, so the habitat is built with burrows, overhangs, and rock shade the animals move between as the sun crosses."]},"book-a-party":{"t":"Book a Party - Indiana Zooniversity","l":"Book a Party","v":3,"p":"birthday-parties","h":"Reserve your date","d":"Parties run Saturdays and Sundays year-round with morning and afternoon slots. Book at least three weeks ahead; spring weekends go fastest.","s":"What to have ready","b":["Preferred date and time slot, package choice, guest count, birthday child's age, and any allergies in the group. A {$100} deposit holds the date."]},"behind-the-scenes-tours":{"t":"Behind-the-Scenes Tours - Indiana Zooniversity","l":"Behind-the-Scenes Tours","v":3,"p":"animal-encounters","c":["carnivore-care-tour","aquarium-backstage-tour"],"h":"The half of the zoo you don't see","d":"Guided tours into working areas — holding barns, commissary kitchens, aquarium life-support rooms — with the staff who work there.","s":"What all tours have in common","b":["Groups of eight or fewer, {45} to {75} minutes, led by working staff rather than guides. Closed-toe shoes are required on every tour without exception."]},"member-benefits":{"t":"Member Benefits - Indiana Zooniversity","l":"Member Benefits","v":3,"p":"membership","c":["reciprocal-zoo-admission","member-only-events"],"h":"Everything membership gets you","d":"Beyond unlimited admission — early entry, dining and shop discounts, reciprocal access at other zoos, and members-only event nights.","s":"The full benefit set","b":["Thirty minutes of early entry daily, {10%} off dining and retail, {20%} off camps and classes, discounted event tickets, and reciprocal admission nationwide."]},"feeding-demonstrations":{"t":"Feeding Demonstrations - Indiana Zooniversity","l":"Feeding Demonstrations","v":3,"p":"daily-activities","h":"Watch them eat","d":"Seven scheduled feeding demonstrations a day, each narrated by the keeper doing the feeding. The most active animal behavior you'll see all day.","s":"Where and when","b":["Penguins, otters, lions, sharks, elephants, primates, and the aviary all feed on a published schedule. Times are staggered so you can catch three or four in a single visit."]},"fall-boo-at-the-zoo":{"t":"Fall: Boo at the Zoo - Indiana Zooniversity","l":"Fall: Boo at the Zoo","v":3,"p":"seasonal-events","h":"Trick-or-treat among the animals","d":"Two October weekends of costumed trick-or-treating along a marked trail, with {20} candy stations and daytime hours suited to young children.","s":"How the trail works","b":["The trail runs the full main loop with a station roughly every two minutes of walking. Costumes are encouraged for all ages; masks that obscure vision aren't permitted on the boardwalks."]},"amazon-flooded-forest":{"t":"Amazon Flooded Forest - Indiana Zooniversity","l":"Amazon Flooded Forest","v":3,"p":"south-america","c":["giant-river-otter"],"h":"A forest that spends half the year underwater","d":"Our flooded-forest habitat rises and falls by four feet across the year, moving the waterline up the tree trunks exactly as it does in the wild.","s":"Why the water moves","b":["Amazon river levels swing dramatically with the rainy season, and fish move into the forest canopy to feed. Our cycle is compressed but follows the same pattern, and the animals respond to it."]},"species-survival-plans":{"t":"Species Survival Plans - Indiana Zooniversity","l":"Species Survival Plans","v":3,"p":"our-conservation-work","h":"Breeding programs across institutions","d":"We participate in {28} Species Survival Plans, cooperative breeding programs that manage populations across accredited zoos as a single gene pool.","s":"How an SSP works","b":["A committee of specialists uses pedigree data to recommend which animals should breed and where they should live. That's why animals move between zoos — genetics, not attendance."]},"transit-bike-rideshare":{"t":"Transit, Bike & Rideshare - Indiana Zooniversity","l":"Transit, Bike & Rideshare","v":3,"p":"getting-here","h":"Arriving without a car","d":"Bus route {12} stops at the north path every twenty minutes. Bike racks and a rideshare pickup zone sit just outside the main gate.","s":"Where each mode drops you","b":["Transit riders enter through the north path, a four-minute walk to the gate. Rideshare pickup and drop-off is at the marked curb west of the main entrance, not in the parking lot."]},"interactive-zoo-map":{"t":"Interactive Zoo Map - Indiana Zooniversity","l":"Interactive Zoo Map","v":3,"p":"maps-guides","h":"Live map with today's closures","d":"The interactive map shows current habitat status, restroom and dining locations, and the next scheduled keeper talk at each stop.","s":"What updates in real time","b":["Habitat closures, weather holds, and demonstration times refresh every fifteen minutes. Your location shows on the map without needing to download anything."]},"keeper-talks":{"t":"Keeper Talks - Indiana Zooniversity","l":"Keeper Talks","v":3,"p":"daily-activities","c":["keeper-talk-locations"],"h":"Ten minutes with the person who knows","d":"Short, informal talks given at the habitat rail by the keeper who works with those animals every day. Always ends with questions.","s":"Why these are worth stopping for","b":["Keeper talks aren't scripted. You get individual animals' names, histories, and quirks — the kind of detail that never makes it onto a habitat sign."]},"childrens-barnyard":{"t":"Children's Barnyard - Indiana Zooniversity","l":"Children's Barnyard","v":3,"p":"play-discovery-zones","h":"Meet a goat","d":"A walk-in contact yard with pygmy goats, sheep, and a miniature donkey, staffed continuously with brushes available for anyone who wants to groom.","s":"How to interact","b":["Brush along the back and sides, never on the head. Handwashing is required on exit and stations are directly at the gate. Goats leave the yard when they've had enough."]},"matching-gifts":{"t":"Matching Gifts - Indiana Zooniversity","l":"Matching Gifts","v":3,"p":"corporate-partnership","h":"Double your donation","d":"More than {200} area employers match charitable gifts to the zoo, and many also match volunteer hours with a cash contribution.","s":"How to check and submit","b":["Search your employer in the matching gift database, submit their form with your gift receipt, and we handle the verification. Matches typically process in {8} to {12} weeks."]},"lesson-plans":{"t":"Lesson Plans - Indiana Zooniversity","l":"Lesson Plans","v":3,"p":"classroom-resources","c":["animal-adaptations-unit","food-webs-unit"],"h":"Ready-to-teach units","d":"Multi-day units built by classroom teachers and reviewed by our education team, complete with objectives, materials lists, and assessments.","s":"How the units are structured","b":["Each unit runs three to five class periods with a hook lesson, two investigation lessons, and a performance task. Every lesson lists its standards alignment on the first page."]},"parking":{"t":"Parking - Indiana Zooniversity","l":"Parking","v":3,"p":"getting-here","c":["main-visitor-lot","bus-oversized-vehicles","accessible-parking"],"h":"Where to leave the car","d":"Parking is free and never sells out, though the closest rows fill by 11 a.m. on summer weekends. Lots are lettered and marked with animal icons.","s":"How the lots are organized","b":["Lot A sits closest to the main gate, Lots B and C are a five-minute walk with a shuttle running every ten minutes, and the east lot serves buses and accessible parking."]},"tropical-aviary":{"t":"Tropical Aviary - Indiana Zooniversity","l":"Tropical Aviary","v":3,"p":"south-america","h":"Walk into the flock","d":"A free-flight aviary with no barrier between you and {40} species of tropical bird. Macaws, toucans, and tanagers move freely around the path.","s":"Walking through a free-flight space","b":["Stay on the path, keep hands down, and don't reach for a bird that lands near you. Double doors at each end prevent escapes, so expect a short wait at both entrances."]},"zoo-career-exploration":{"t":"Zoo Career Exploration - Indiana Zooniversity","l":"Zoo Career Exploration","v":3,"p":"teen-programs","h":"What the jobs actually are","d":"A look at the {20}-plus career paths inside a modern zoo — keeper, veterinarian, nutritionist, horticulturist, registrar, educator — and how people got there.","s":"More than keepers","b":["Animal care is roughly a third of the staff. The rest are veterinary, education, horticulture, facilities, and conservation science. Each profile lists real education paths and entry points."]},"todays-schedule":{"t":"Today's Schedule - Indiana Zooniversity","l":"Today's Schedule","v":3,"p":"daily-activities","h":"Every program, in order","d":"The live daily schedule with times, locations, and any weather holds currently in effect. Updated every fifteen minutes throughout the day.","s":"Reading the schedule","b":["Programs marked \"weather permitting\" cancel in rain or lightning. Anything marked \"animal choice\" runs only if the animal participates, which is most but not all days."]},"penguin-coast":{"t":"Penguin Coast - Indiana Zooniversity","l":"Penguin Coast","v":3,"p":"arctic-oceans","c":["humboldt-penguin","king-penguin"],"h":"Two colonies, two climates","d":"A temperate rocky shore and a sub-antarctic ice shelf, separated by glass and about {30} degrees. Both colonies have full underwater viewing.","s":"Why two habitats","b":["Penguins are not all cold-weather birds. Humboldts live on warm South American coastlines while king penguins need near-freezing conditions, so the two colonies are climate-separated."]},"outback-walkabout":{"t":"Outback Walkabout - Indiana Zooniversity","l":"Outback Walkabout","v":3,"p":"australia-islands","c":["red-kangaroo"],"h":"Share the path with the kangaroos","d":"A walk-through habitat where a mob of red kangaroos and a group of emu move freely across the same path you're standing on.","s":"Rules of the walkabout","b":["Stay on the path, don't approach or touch, and give any animal that moves toward you room to pass. The kangaroos have right of way everywhere in the habitat."]},"internships":{"t":"Internships - Indiana Zooniversity","l":"Internships","v":3,"p":"volunteer","h":"Paid internships for college students","d":"Twelve-week paid internships in animal care, education, veterinary services, horticulture, and conservation science, offered each summer and fall.","s":"What interns do","b":["Interns are assigned to a department and carry real responsibilities, not shadowing. Each completes an independent project presented to staff at the end of the term."]},"school-break-camps":{"t":"School Break Camps - Indiana Zooniversity","l":"School Break Camps","v":3,"p":"camps-classes","h":"Single days off, covered","d":"One-day camps on scheduled school break days in fall, winter, and spring for ages 5 to 12, with the same structure as summer camp compressed into a day.","s":"When they run","b":["Break camps follow the {local district} calendar and are posted eight weeks ahead. Each runs {9:00 AM} to {4:00 PM} with the same before and after care as summer."]},"join-or-renew":{"t":"Join or Renew - Indiana Zooniversity","l":"Join or Renew","v":3,"p":"membership","h":"Sign up or pick back up","d":"New memberships activate immediately and can be used the same day. Renewals extend from your existing expiration date, so nothing is lost by renewing early.","s":"What you'll need","b":["Names and birth dates for everyone covered, a home address, and payment. Digital cards arrive by email within minutes; physical cards mail in {10} business days."]},"bamboo-forest":{"t":"Bamboo Forest - Indiana Zooniversity","l":"Bamboo Forest","v":3,"p":"asia","c":["giant-panda","red-panda"],"h":"Twenty tons of bamboo a year","d":"A dense grove of live bamboo shading both panda species. The bamboo is a working crop — we grow most of what they eat on site.","s":"Growing the diet","b":["Pandas eat almost nothing else, and they're selective about species and season. Our grove rotates through {6} bamboo varieties so there's always a preferred cut available."]},"wild-wine-walk":{"t":"Wild Wine Walk - Indiana Zooniversity","l":"Wild Wine Walk","v":3,"p":"adults-only-events","h":"A walking tasting","d":"A spring evening pairing wines with stations along the main loop, each hosted beside a habitat with a short keeper talk between pours.","s":"How the walk is structured","b":["Eight stations, one pour each, spread along a {1}-mile route with a keeper talk at every stop. The full walk takes about two hours at a comfortable pace."]},"tiger-ridge":{"t":"Tiger Ridge - Indiana Zooniversity","l":"Tiger Ridge","v":3,"p":"asia","c":["amur-tiger"],"h":"The largest cat in the world","d":"A forested ridge habitat with a deep swimming pool, elevated platforms, and long sightlines through the trees. Tigers are strongest swimmers of any big cat.","s":"Built for a solitary hunter","b":["Unlike lions, tigers live alone across enormous territories. The habitat is designed with visual breaks and multiple retreat spaces so an animal can genuinely be out of sight."]},"discovery-playground":{"t":"Discovery Playground - Indiana Zooniversity","l":"Discovery Playground","v":3,"p":"play-discovery-zones","h":"Climb, dig, splash","d":"A nature-themed play structure with a climbing web, a dig pit, a water channel, and a shaded seating deck for the adults.","s":"What's there","b":["Equipment is scaled for ages 2 to 10 with separate toddler and older-child zones. The water channel runs May through September and is turned off in cool weather."]},"plan-a-field-trip":{"t":"Plan a Field Trip - Indiana Zooniversity","l":"Plan a Field Trip","v":3,"p":"field-trips","c":["booking-reservations","chaperone-guidelines"],"h":"Everything you need before booking","d":"Field trips run September through May, Tuesday through Friday. Most schools book eight to twelve weeks ahead; spring dates fill fastest.","s":"The planning sequence","b":["Choose a program, request a date, confirm your headcount, then distribute the chaperone guide. Payment is due {14} days before the visit."]},"sponsorship-opportunities":{"t":"Sponsorship Opportunities - Indiana Zooniversity","l":"Sponsorship Opportunities","v":3,"p":"corporate-partnership","c":["event-sponsorships","habitat-naming"],"h":"Where your name can appear","d":"Event sponsorships, habitat naming rights, program underwriting, and seasonal campaign partnerships across a wide range of commitment levels.","s":"Matching scale to goals","b":["Event sponsorships suit brand visibility with a specific audience. Habitat naming suits long-term community identity. Program underwriting suits companies with a mission alignment."]},"giraffe-feeding":{"t":"Giraffe Feeding - Indiana Zooniversity","l":"Giraffe Feeding","v":3,"p":"animal-encounters","h":"Lettuce, at eye level","d":"The most popular encounter at the zoo. Fifteen minutes on the elevated deck feeding the giraffe herd by hand, with a keeper alongside.","s":"How to get a spot","b":["Sessions run twice daily with {10} spots each. Reserve online up to {30} days ahead; same-day spots are released at opening and typically gone by {10:30 AM}."]},"guided-programs-by-grade":{"t":"Guided Programs by Grade - Indiana Zooniversity","l":"Guided Programs by Grade","v":3,"p":"field-trips","c":["pre-k-kindergarten","grades-15","grades-612"],"h":"Programs matched to grade level","d":"Three program tracks, each {60} minutes, each aligned to the science standards for its grade band. All include live animal contact.","s":"Choosing a track","b":["Programs are grouped by grade band rather than age. Mixed-grade groups should book the track matching the majority; educators adjust in the moment."]},"suggested-routes":{"t":"Suggested Routes - Indiana Zooniversity","l":"Suggested Routes","v":3,"p":"maps-guides","c":["two-hour-highlights-route","full-day-explorer-route"],"h":"Pre-planned walking routes","d":"Three routes built around how much time you have. Each is a continuous loop that ends back at the central plaza.","s":"Choosing a route","b":["Routes are timed at an unhurried pace including one rest stop. Add thirty minutes if you plan to eat a sit-down lunch or stop for a keeper talk."]},"winter-wild-lights":{"t":"Winter: Wild Lights - Indiana Zooniversity","l":"Winter: Wild Lights","v":3,"p":"seasonal-events","c":["timed-entry-tickets"],"h":"A million lights after dark","d":"Six weeks of illuminated animal sculptures and lit pathways through the zoo, running nightly from late {November} through early {January}.","s":"What's on the route","b":["A {1.2}-mile lit walking route with {60} illuminated sculptures, three warming stations, and hot drinks along the way. Most animal habitats are closed during Wild Lights."]},"gift-shops":{"t":"Gift Shops - Indiana Zooniversity","l":"Gift Shops","v":3,"p":"dining-shopping","h":"Souvenirs and supporting the zoo","d":"Three shops along the loop, with proceeds funding animal care and conservation programs. Members save ten percent on everything.","s":"What you'll find","b":["Plush animals, books, apparel, and a fair-trade section sourced from communities near our field conservation sites. The main shop sits just inside the west gate."]},"mobility-wheelchair-access":{"t":"Mobility & Wheelchair Access - Indiana Zooniversity","l":"Mobility & Wheelchair Access","v":3,"p":"accessibility","c":["wheelchair-stroller-rentals"],"h":"Getting around on wheels","d":"Every habitat viewing area is reachable by a step-free route. Two pathway spurs have grades above five percent and are marked on the map.","s":"Grades and surfaces","b":["The main loop is asphalt with no grade above three percent. The rainforest spur and the overlook spur are the two steeper routes; both have level alternates."]},"lorikeet-landing":{"t":"Lorikeet Landing - Indiana Zooniversity","l":"Lorikeet Landing","v":3,"p":"australia-islands","h":"Feed a rainbow lorikeet from your hand","d":"Buy a cup of nectar, hold it out, and wait. Our flock of {60} lorikeets will land on hands, arms, and shoulders within seconds.","s":"How the feeding works","b":["Nectar cups are {$3} and available at the entrance. Birds are fed a full diet regardless, so if the flock isn't interested they've simply had enough for the day."]},"giant-panda":{"t":"Giant Panda - Indiana Zooniversity","l":"Giant Panda","v":4,"p":"bamboo-forest","c":["panda-cub-cam"],"h":"A bear that gave up meat","d":"Our pair arrived in {2019} as part of an international breeding partnership. Their cub, born last spring, now shares the outdoor habitat during morning hours.","s":"Fourteen hours of eating","b":["Pandas have a carnivore's digestive system and a herbivore's diet, so they extract very little energy from each meal. That's why they eat for most of the day and move as little as possible in between."]},"timed-entry-tickets":{"t":"Timed-Entry Tickets - Indiana Zooniversity","l":"Timed-Entry Tickets","v":4,"p":"winter-wild-lights","h":"Pick an entry window","d":"Wild Lights uses {30}-minute timed entry to control crowding on the pathway. Tickets are separate from daytime admission, including for members.","s":"Choosing a window","b":["The {5:00} and {5:30} windows are the busiest. A
